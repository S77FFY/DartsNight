<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wednesday Darts</title>
<style>
:root{
  --chalk:#EFE7D2;
  --chalk-2:#DED3B6;
  --bed:#15160F;
  --bed-2:#1F2117;
  --wire:#C9992B;
  --green:#1E7A3A;
  --green-lit:#2A9E4B;
  --orange:#E2732A;
  --red:#B92A20;
  --ink:#0B0C08;
  --display:"Haettenschweiler","Arial Narrow Bold","Impact","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bed);color:var(--chalk);font-family:var(--body);
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:8px 16px;
  background:var(--ink);border-bottom:2px solid var(--wire);flex:0 0 auto;flex-wrap:wrap;
}
.brand{font-family:var(--display);font-size:clamp(20px,2.4vw,34px);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk)}
.brand b{color:var(--wire)}
.meta{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.pill{
  font-family:var(--data);font-size:clamp(11px,1.05vw,15px);letter-spacing:.04em;
  border:1px solid rgba(239,231,210,.28);border-radius:999px;padding:5px 12px;white-space:nowrap;
}
.pill.gold{border-color:var(--wire);color:var(--wire)}
.pill.tap{cursor:pointer}
.pill.tap:hover{background:rgba(201,153,43,.14)}
.btn{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.07em;
  font-size:clamp(14px,1.3vw,20px);padding:9px 20px;border:2px solid var(--chalk);
  background:var(--chalk);color:var(--ink);border-radius:2px;
}
.btn:hover{background:var(--wire);border-color:var(--wire)}
.btn.ghost{background:none;color:var(--chalk)}
.btn.ghost:hover{background:var(--chalk);color:var(--ink)}
.btn.small{font-size:14px;padding:6px 14px}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn:disabled:hover{background:var(--chalk);border-color:var(--chalk);color:var(--ink)}
.btn.ghost:disabled:hover{background:none;color:var(--chalk)}
:focus-visible{outline:3px solid var(--wire);outline-offset:2px}

/* ---------- setup / entry panels ---------- */
.panel{flex:1 1 auto;overflow-y:auto;padding:22px clamp(16px,3vw,48px) 40px}
.panel.cream{background:var(--chalk);color:var(--ink)}
.sect{max-width:1100px;margin:0 auto}
.sect.wide{max-width:1500px}
.eyebrow{
  font-family:var(--data);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  opacity:.6;margin:26px 0 10px;display:flex;align-items:center;gap:12px;
}
.eyebrow:first-child{margin-top:4px}
.eyebrow::after{content:"";flex:1;height:1px;background:currentColor;opacity:.3}
h1.big{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(38px,7vw,86px);line-height:.92;margin:0 0 6px}
.sub{font-size:clamp(14px,1.4vw,18px);opacity:.7;margin:0 0 8px;max-width:56ch}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;
  font-size:clamp(18px,2vw,28px);padding:12px 26px;border:2px solid var(--ink);
  border-radius:2px;background:none;color:var(--ink);
}
.panel:not(.cream) .choice{border-color:var(--chalk);color:var(--chalk)}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--chalk)}
.panel:not(.cream) .choice[aria-pressed="true"]{background:var(--wire);border-color:var(--wire);color:var(--ink)}
.choice small{display:block;font-family:var(--data);font-size:10px;letter-spacing:.14em;opacity:.65;margin-top:2px}

/* ---------- chips ---------- */
.chiprow{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.nameinput{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;
  font-size:clamp(20px,2.2vw,30px);padding:10px 16px;border:2px solid var(--ink);
  background:transparent;color:var(--ink);border-radius:2px;min-width:min(340px,70vw);
}
.chipgrid{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px;align-items:flex-start}
.chip{
  position:relative;width:104px;height:104px;border-radius:50%;
  background:var(--chalk);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--ink);cursor:pointer;user-select:none;flex:0 0 auto;
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 7px var(--chalk),inset 0 0 0 10px currentColor;
  transition:transform .16s ease, box-shadow .16s ease;
}
.chip::before{
  content:"";position:absolute;inset:11px;border-radius:50%;
  background:repeating-conic-gradient(currentColor 0 8deg, transparent 8deg 30deg);
  opacity:.9;-webkit-mask:radial-gradient(circle,transparent 0 66%,#000 66% 100%);
  mask:radial-gradient(circle,transparent 0 66%,#000 66% 100%);
}
.chip .nm{
  color:var(--ink);position:relative;font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;
  font-size:19px;line-height:1;max-width:66px;overflow-wrap:anywhere;text-align:center;
}
.chip .rk{position:relative;font-family:var(--data);font-size:10px;letter-spacing:.1em;opacity:.55;margin-top:3px}
.chip.player{color:var(--red)}
.chip.nonplayer{color:var(--green)}
.chip.out{color:#8a8a80;opacity:.5}
.chip.out .nm{text-decoration:line-through;color:#8a8a80}
.chip:hover{transform:translateY(-3px)}
.chip .x{
  position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;
  background:var(--ink);color:var(--chalk);font-size:15px;line-height:26px;text-align:center;
  opacity:0;transition:opacity .15s;
}
.chip:hover .x,.chip:focus-within .x{opacity:1}
.chip .mv{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;opacity:0;transition:opacity .15s}
.chip:hover .mv{opacity:1}
.chip .mv button{
  width:26px;height:22px;background:var(--ink);color:var(--chalk);border-radius:2px;font-size:12px;line-height:22px}
.divider{
  flex:0 0 100%;display:flex;align-items:center;gap:12px;margin:10px 0 2px;
  font-family:var(--data);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:currentColor;opacity:.35}

/* ---------- draw / teams ---------- */
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:6px}
.teamcard{
  display:flex;align-items:center;gap:12px;background:rgba(11,12,8,.06);
  border:2px solid rgba(11,12,8,.2);border-radius:2px;padding:10px 12px;
}
.panel:not(.cream) .teamcard{background:rgba(239,231,210,.06);border-color:rgba(239,231,210,.2)}
.tnum{
  font-family:var(--display);font-size:34px;line-height:1;width:46px;height:46px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--wire);border-radius:2px;
}
.tnames{font-family:var(--display);text-transform:uppercase;font-size:21px;letter-spacing:.03em;line-height:1.05}
.tnames em{font-style:normal;opacity:.45;padding:0 4px}
.grouptag{font-family:var(--data);font-size:10px;letter-spacing:.16em;opacity:.55;margin-top:2px}
.drawing .teamcard{animation:snap .38s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes snap{from{opacity:0;transform:translateY(-18px) rotate(-4deg)}to{opacity:1;transform:none}}

/* ---------- play screen ---------- */
.board{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.standings{
  flex:0 0 auto;max-height:47%;overflow-y:auto;background:var(--chalk);color:var(--ink);
  padding:10px clamp(10px,1.6vw,22px) 14px;border-bottom:3px solid var(--wire);
}
.stand-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.stand-head h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(15px,1.5vw,21px);margin:0}
.stand-head span{font-family:var(--data);font-size:11px;letter-spacing:.14em;opacity:.55}
.stand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(190px,15vw,250px),1fr));gap:7px}
.srow{
  display:flex;align-items:center;gap:9px;padding:5px 9px;border:2px solid rgba(11,12,8,.16);
  background:rgba(11,12,8,.03);border-radius:2px;
}
.srow .n{
  font-family:var(--display);font-size:clamp(19px,1.7vw,26px);line-height:1;
  width:clamp(30px,2.4vw,38px);height:clamp(30px,2.4vw,38px);display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--chalk);border-radius:2px;flex:0 0 auto;
}
.srow .who{
  font-family:var(--display);text-transform:uppercase;font-size:clamp(14px,1.25vw,19px);line-height:1.05;
  flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em;
}
.srow .w{font-family:var(--display);font-size:clamp(22px,2vw,32px);line-height:1;width:2.2ch;text-align:right}
.srow .pos{font-family:var(--data);font-size:10px;letter-spacing:.06em;opacity:.5;width:3.4ch;text-align:right;margin-left:auto}
.srow.lead .pos{opacity:.9;color:#8a6a12}
.srow .legs{font-family:var(--data);font-size:10px;opacity:.5;width:34px;text-align:right}
.srow.lead{border-color:var(--wire);background:rgba(201,153,43,.18)}
.srow.playing{box-shadow:inset 4px 0 0 var(--orange)}
.srow .grp{font-family:var(--data);font-size:10px;opacity:.45;letter-spacing:.1em}

/* fixtures */
.fixwrap{flex:1 1 auto;overflow-y:auto;padding:10px clamp(10px,1.6vw,22px) 24px}
.fixhead{display:flex;align-items:baseline;gap:14px;margin:6px 0 8px}
.fixhead h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:clamp(15px,1.5vw,21px);margin:0;color:var(--wire)}
.fixhead span{font-family:var(--data);font-size:11px;letter-spacing:.14em;opacity:.5}
.fixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(150px,11vw,190px),1fr));gap:8px}
.erow input[data-ename]{text-transform:uppercase;letter-spacing:.05em}
.erow .stepper button{width:36px;height:36px;font-size:21px}
.erow .stepper b{font-size:24px;width:36px}
.arow .grouptag{margin-left:auto;white-space:nowrap}
.gm{
  position:relative;touch-action:manipulation;border:2px solid;border-radius:3px;padding:16px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px;
  background:rgba(0,0,0,.25);cursor:pointer;transition:transform .12s ease;
}
.gm:hover{transform:translateY(-2px)}
.gm .vs{display:flex;align-items:stretch;gap:4px;width:100%}
.sidecol{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 2px 5px;background:none;border:none;
}
.sname{
  font-family:var(--body);font-size:clamp(9px,.72vw,11px);text-transform:uppercase;letter-spacing:.02em;
  line-height:1.25;opacity:.6;text-align:center;width:100%;
}
.sname .ln{display:block;overflow-wrap:anywhere}
.sname .amp{opacity:.85}
.slegs{font-family:var(--data);font-size:11px;letter-spacing:.1em;opacity:.7;line-height:1}
.gm .side{
  font-family:var(--display);font-size:clamp(26px,2.6vw,40px);line-height:1;
  min-width:clamp(34px,3vw,46px);text-align:center;padding:1px 4px;border-radius:50%;
  border:3px solid transparent;display:block;
}
.gm .x{font-family:var(--data);font-size:11px;opacity:.4;align-self:center;padding-bottom:14px}
.gm .rd{position:absolute;top:4px;left:6px;font-family:var(--data);font-size:9px;opacity:.45;letter-spacing:.08em}
.gm .bd.nx{background:var(--wire);color:var(--ink)}
.gm .bd{
  position:absolute;top:-1px;right:-1px;font-family:var(--display);font-size:19px;line-height:1;
  background:var(--orange);color:var(--ink);padding:2px 8px;border-radius:0 2px 0 4px;
}
.gm .legs{font-family:var(--data);font-size:11px;letter-spacing:.14em;opacity:.75}
.gm.pending{border-color:var(--green);background:rgba(30,122,58,.2)}
.gm.next{border-color:var(--wire);background:rgba(201,153,43,.22);box-shadow:0 0 0 4px rgba(201,153,43,.3)}
.gm.blocked{border-color:var(--green);background:rgba(30,122,58,.2);opacity:.42;cursor:not-allowed}
.gm.blocked:hover{transform:none}
.gm.live{border-color:var(--orange);background:rgba(226,115,42,.28)}
.gm.done{border-color:var(--red);background:rgba(185,42,32,.24);opacity:.85}
.gm.done .sidecol.win .side{border-color:var(--wire);color:var(--wire)}
.gm.done .sidecol.win .sname{opacity:.95;color:var(--wire)}
.gm.done .sidecol:not(.win){opacity:.4}
.gm.live .sidecol{cursor:pointer}
.gm.live .sidecol .side{border-color:rgba(239,231,210,.3)}
.gm.live .sidecol:hover .side{border-color:var(--chalk);color:var(--chalk)}
.gm.live .sidecol:hover .sname{opacity:.95}
.sidecol:focus-visible{outline:none}
.sidecol:focus-visible .side{outline:3px solid var(--wire);outline-offset:2px}
.gm.final{grid-column:span 2;border-width:3px}
.gm .undo{
  position:absolute;bottom:1px;right:3px;font-size:13px;line-height:1;
  opacity:.4;transition:opacity .15s;padding:3px 5px;
}
.gm:hover .undo{opacity:.95}
.gm .undo:hover{opacity:1;color:var(--wire)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--data);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin:14px 0 2px}
.legend i{display:inline-block;width:11px;height:11px;border:2px solid;margin-right:5px;vertical-align:-1px;border-radius:2px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,6,4,.86);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal{
  background:var(--chalk);color:var(--ink);border:3px solid var(--wire);border-radius:3px;
  padding:24px clamp(18px,3vw,36px);max-width:820px;width:100%;max-height:86vh;overflow-y:auto;
}
.modal h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:clamp(26px,3.4vw,46px);margin:0 0 6px;line-height:1}
.modal p{margin:0 0 16px;opacity:.75;max-width:60ch}
.modal .btn{border-color:var(--ink);background:var(--ink);color:var(--chalk)}
.modal .btn:hover{background:var(--wire);border-color:var(--wire);color:var(--ink)}
.modal .btn.ghost{background:none;color:var(--ink)}
.picklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.pick{display:flex;align-items:center;gap:11px;border:2px solid var(--ink);border-radius:2px;padding:11px;text-align:left;width:100%}
.pick:hover{background:var(--ink);color:var(--chalk)}
.pick:hover .tnum{background:var(--wire);color:var(--ink)}
.pick.taken{opacity:.4}
.modalrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.field input{border:2px solid var(--ink);background:none;color:inherit;padding:9px 12px;border-radius:2px;font-family:var(--display);font-size:22px;letter-spacing:.04em}
.podium{display:grid;gap:12px;margin:14px 0 20px}
.plc{display:flex;align-items:center;gap:14px;border:3px solid var(--ink);padding:14px;border-radius:2px}
.plc .rank{font-family:var(--display);font-size:clamp(30px,4vw,54px);line-height:1;width:2.2ch;text-align:center}
.plc .who{font-family:var(--display);text-transform:uppercase;font-size:clamp(22px,2.6vw,38px);line-height:1}
.plc .rec{font-family:var(--data);font-size:12px;opacity:.6;margin-left:auto}
.plc.gold{background:var(--wire);border-color:var(--ink)}
.plc.silver{background:rgba(11,12,8,.1)}
/* ---------- league ---------- */
.arows{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--ink);border-radius:2px;padding:10px 12px}
.arow.win{background:var(--wire)}
.arow .tnames{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .btn{margin-left:auto;border-color:var(--ink)}
.arow .btn.ghost{background:none;color:var(--ink)}
.stepper{display:flex;align-items:center;gap:2px;margin-left:auto}
.stepper button{min-width:40px;padding:0 8px;height:40px;border:2px solid var(--ink);border-radius:2px;font-family:var(--display);font-size:24px;line-height:1}
.stepper button:hover{background:var(--ink);color:var(--chalk)}
.stepper b{font-family:var(--display);font-size:30px;min-width:60px;text-align:center}
.co-badge{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  background:var(--wire);color:var(--ink);font-family:var(--display);font-size:13px;line-height:1;
  padding:3px 9px;border-radius:999px;border:2px solid var(--ink);z-index:2}
.chip.co{cursor:pointer}
.chip.co .co-score{font-family:var(--display);font-size:15px;color:var(--wire);opacity:1;margin-top:1px}
.chip.co.on .co-score{color:var(--ink)}
.rack .chip{width:86px;height:86px;border-width:2px;box-shadow:none;background:rgba(11,12,8,.05);color:rgba(11,12,8,.3);border-color:rgba(11,12,8,.28)}
.rack .chip::before{opacity:.5}
.rack .chip .nm{font-size:16px;max-width:60px;color:rgba(11,12,8,.55)}
.rack .chip .rk{font-size:9px}
.rack .chip.on{background:var(--chalk);color:var(--green);border-color:var(--ink);
  box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 0 0 6px var(--chalk),inset 0 0 0 9px currentColor}
.rack .chip.on .nm{color:var(--ink)}
.rack .chip .tick{position:absolute;top:-5px;right:-5px;width:24px;height:24px;border-radius:50%;
  background:var(--green);color:var(--chalk);font-size:13px;line-height:24px;text-align:center;z-index:2}
.qrwrap{display:flex;justify-content:center;padding:10px;background:#FFF;border:3px solid var(--ink);border-radius:3px;margin-bottom:14px}
.qr{width:100%;max-width:min(560px,78vw,64vh);height:auto;display:block}
.scrim.big{background:#FFF;padding:0;cursor:pointer}
.bigwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:#FFF}
.bigwrap .qr{width:min(96vw,92vh);max-width:none}
.bighint{font-family:var(--data);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#555;padding:10px 0 14px}
.pastebox{flex:1 1 220px;min-width:0;border:2px solid var(--ink);background:none;color:inherit;
  padding:10px 12px;border-radius:2px;font-family:var(--data);font-size:13px}
#copyNote{align-self:center}
.vtag{
  font-family:var(--data);font-size:clamp(12px,1.1vw,15px);letter-spacing:.14em;
  color:var(--wire);border:1px solid var(--wire);border-radius:999px;
  padding:5px 12px;white-space:nowrap;
}
.ltable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ltable thead th{
  font-family:var(--data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  opacity:.55;font-weight:400;text-align:right;padding:0 8px 7px;border-bottom:2px solid var(--ink);
}
.ltable th.c-pos,.ltable th.c-name{text-align:left}
.ltable td{padding:11px 10px;border-bottom:1px solid rgba(11,12,8,.16);text-align:right}
.ltable th:last-child,.ltable td:last-child{padding-right:0}
.ltable th:first-child,.ltable td:first-child{padding-left:0}
.ltable tbody tr:nth-child(even) td{background:rgba(11,12,8,.035)}
.ltable .c-pos{font-family:var(--data);font-size:12px;opacity:.5;width:3ch;text-align:left}
.ltable .c-name{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(18px,1.9vw,26px);line-height:1.1;text-align:left;width:99%;
}
.ltable .c-num{font-family:var(--data);font-size:clamp(13px,1.15vw,16px);opacity:.6;width:clamp(56px,6vw,90px)}
.ltable .c-win{font-family:var(--display);font-size:clamp(24px,2.4vw,36px);opacity:1;width:clamp(52px,5vw,80px)}
.ltable tr.lead td{background:rgba(201,153,43,.22)}
.ltable tr.lead .c-pos{opacity:.8}
.crownmark{color:var(--wire);font-size:.7em;margin-left:8px;vertical-align:.15em}

<body>
<div id="app"></div>
<script>

/* Wednesday Darts — single file, no dependencies. */
(function(){
'use strict';

var VERSION='1.11.1';
var KEY='wednesday-darts-v1';
var store=(function(){
  try{var t='__t';localStorage.setItem(t,t);localStorage.removeItem(t);return localStorage;}
  catch(e){var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]}};}
})();

function fresh(){
  return {
    phase:'setup',
    cfg:{score:501,bestOf:1,boards:2,fee:3,twoGroups:false,splitA:0,date:todayISO(),decider:null},
    league:{weeks:[],crowns:[]},
    prevPhase:'setup',
    edit:null,
    gedit:null,
    people:[],            // {id,name,out}
    teams:[],             // {n,a,b,grp}
    fixtures:[],          // {id,grp,rd,a,b,st,board,la,lb,win,kind}
    checkout:{name:'',score:0},
    checkouts:[],
    co:null,
    share:null,
    imp:null,
    manualRank:{},        // teamNum -> rank within tie cluster
    finished:false,
    appVersion:'',
    pendingEnd:false,
    pair:{sel:null,made:[]} // manual pairing scratch
  };
}
var S=fresh();
var BAK=KEY+'.bak';
try{
  var raw=store.getItem(KEY);
  if(raw){
    var p=JSON.parse(raw);
    if(p&&p.phase){
      /* Before touching anything, keep a copy of the save exactly as the previous build
         left it. Written once per upgrade, so a bad upgrade is always reversible. */
      if(p.appVersion!==VERSION){
        try{store.setItem(BAK,JSON.stringify({v:p.appVersion||'before 1.10.0',at:todayISO(),data:raw}));}catch(e2){}
      }
      S=Object.assign(fresh(),p);
      S.cfg=Object.assign(fresh().cfg,S.cfg||{});
      S.league=Object.assign({weeks:[],crowns:[]},S.league||{});
      if(!Array.isArray(S.checkouts))S.checkouts=[];
      /* Checkouts became one-per-player in 1.7.0; carry an older single figure across. */
      if(!S.checkouts.length&&S.checkout&&S.checkout.score>0&&S.checkout.name)
        S.checkouts=[{n:String(S.checkout.name).toUpperCase(),s:S.checkout.score}];
      if(!S.co)S.co=null;
      if(!S.share)S.share=null;
      if(!S.imp)S.imp=null;
    }
  }
}catch(e){}
function backupInfo(){
  try{
    var b=store.getItem(BAK);
    if(!b)return null;
    var o=JSON.parse(b);
    return o&&o.data?o:null;
  }catch(e){return null;}
}
function save(){try{S.appVersion=VERSION;store.setItem(KEY,JSON.stringify(S));}catch(e){}}

function ordinal(n){var s2=['th','st','nd','rd'],v=n%100;return n+(s2[(v-20)%10]||s2[v]||s2[0]);}
function pad(n){return n<10?'0'+n:''+n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){var p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function monthKey(s){return String(s||'').slice(0,7);}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function monthLabel(mk){var p=mk.split('-');return MONTHS[(+p[1])-1]+' '+p[0];}
function dayLabel(s){var d=parseISO(s);return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);}
function shiftMonth(mk,n){var p=mk.split('-'),d=new Date(+p[0],(+p[1])-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function isLastOfMonth(s){var d=parseISO(s),n=new Date(d.getTime());n.setDate(n.getDate()+7);return n.getMonth()!==d.getMonth();}
function isDeciderWeek(){return S.cfg.decider==null?isLastOfMonth(S.cfg.date):!!S.cfg.decider;}
function key(n){return String(n||'').trim().toLowerCase();}

function leagueTable(mk,excl){
  var m={},order=0;
  S.league.weeks.forEach(function(w){
    if(monthKey(w.d)!==mk)return;
    if(excl&&w.d===excl)return;
    w.rows.forEach(function(r){
      var k=key(r.n);if(!k)return;
      if(!m[k])m[k]={n:r.n,w:0,c:0,o:order++};
      m[k].w+=(+r.w||0);m[k].c++;
    });
  });
  var list=Object.keys(m).map(function(k){return m[k];});
  list.sort(function(a,b){return b.w-a.w||a.o-b.o;});
  return list;
}
function leagueRow(name,mk,excl){
  var k=key(name),t=leagueTable(mk,excl);
  for(var i=0;i<t.length;i++){if(key(t[i].n)===k)return {pos:i+1,w:t[i].w,c:t[i].c};}
  return null;
}
function roster(){
  var m={};S.league.weeks.forEach(function(w){w.rows.forEach(function(r){if(key(r.n))m[key(r.n)]=r.n;});});
  return Object.keys(m).sort().map(function(k){return m[k];});
}
function upsertWeek(d,rows){
  S.league.weeks=S.league.weeks.filter(function(w){return w.d!==d;});
  S.league.weeks.push({d:d,rows:rows});
  S.league.weeks.sort(function(a,b){return a.d<b.d?-1:1;});
}
function nightRows(){
  var m={};
  S.people.forEach(function(p){m[key(p.name)]={n:p.name,w:0};});
  S.teams.forEach(function(t){
    var w=record(t.n).w;
    [t.a,t.b].forEach(function(nm){var k=key(nm);if(!m[k])m[k]={n:nm,w:0};m[k].w+=w;});
  });
  return Object.keys(m).map(function(k){return m[k];});
}
function crownFor(mk){for(var i=0;i<S.league.crowns.length;i++){if(S.league.crowns[i].m===mk)return S.league.crowns[i];}return null;}

function orderedPeople(){
  if(!isDeciderWeek())return S.people.slice();
  var t=leagueTable(monthKey(S.cfg.date),S.cfg.date),pos={};
  t.forEach(function(r,i){pos[key(r.n)]=i;});
  return S.people.map(function(p,i){return {p:p,i:i,k:pos[key(p.name)]};})
    .sort(function(x,y){
      var a=x.k==null?9999:x.k,b=y.k==null?9999:y.k;
      return a-b||x.i-y.i;
    }).map(function(o){return o.p;});
}

/* Up/down: within your own half you shuffle one place at a time towards the top of it;
   press the other way and you cross the divider, landing in the nearest slot of the
   other half. Everyone between shuffles along to fill the gap. */
function movePerson(id,dir){
  var act=active(),n=act.length,half=Math.floor(n/2);
  if(n<2||half<1)return;
  var i=-1;
  for(var k=0;k<act.length;k++){if(act[k].id==id)i=k;}
  if(i<0)return;
  var pos=i+1,target;
  if(dir==='up'){
    if(pos>half)target=half;              // bottom half -> last slot of the top half
    else if(pos>1)target=pos-1;           // already a player -> one place safer
    else return;
  }else{
    if(pos<=half)target=half+1;           // top half -> first slot of the bottom half
    else if(pos<n)target=pos+1;           // already a non-player -> one place lower
    else return;
  }
  var moved=act.splice(i,1)[0];
  act.splice(target-1,0,moved);
  var q=0;
  S.people=S.people.map(function(p){return p.out?p:act[q++];});
}

/* Everyone who's played this month or last, most recent night first. */
function regulars(){
  var mk=monthKey(S.cfg.date),pm=shiftMonth(mk,-1),m={};
  S.league.weeks.forEach(function(w){
    var wm=monthKey(w.d);
    if(wm!==mk&&wm!==pm)return;
    w.rows.forEach(function(r,i){
      var k=key(r.n);if(!k)return;
      if(!m[k])m[k]={n:r.n,last:'',c:0,pos:i,w:0};
      m[k].c++;
      if(wm===mk)m[k].w+=(+r.w||0);
      if(w.d>=m[k].last){m[k].last=w.d;m[k].pos=i;m[k].n=r.n;}
    });
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){
    if(a.last!==b.last)return a.last<b.last?1:-1;
    return a.pos-b.pos||b.c-a.c||(key(a.n)<key(b.n)?-1:1);
  });
}
function here(name){var k=key(name);return S.people.some(function(p){return key(p.name)===k;});}
function addPerson(name){
  var v=String(name||'').trim().toUpperCase();
  if(!v||here(v))return false;
  S.people.push({id:'p'+Date.now()+Math.floor(Math.random()*99999),name:v,out:false});
  return true;
}
function dropPerson(name){var k=key(name);S.people=S.people.filter(function(p){return key(p.name)!==k;});}
/* The most recent night that isn't tonight — used to reuse last week's running order. */
function lastNight(){
  var w=null;
  S.league.weeks.forEach(function(x){if(x.d!==S.cfg.date&&(!w||x.d>w.d))w=x;});
  return w;
}
function applyLastOrder(){
  var w=lastNight();if(!w)return;
  var pos={};w.rows.forEach(function(r,i){pos[key(r.n)]=i;});
  S.people=S.people.map(function(p,i){return {p:p,i:i,k:pos[key(p.name)]};})
    .sort(function(a,b){
      var x=a.k==null?9999:a.k,y=b.k==null?9999:b.k;
      return x-y||a.i-b.i;
    }).map(function(o){return o.p;});
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function active(){return orderedPeople().filter(function(p){return !p.out;});}
function needLegs(){return S.cfg.bestOf===3?2:1;}
function team(n){for(var i=0;i<S.teams.length;i++){if(S.teams[i].n===n)return S.teams[i];}return null;}
function tname(n){var t=team(n);return t?t.a+' & '+t.b:'—';}
function groups(){var g={};S.teams.forEach(function(t){g[t.grp]=1;});return Object.keys(g).sort();}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- fixtures ---------- */
function roundRobin(nums){
  var arr=nums.slice();
  if(arr.length%2)arr.push(null);
  var n=arr.length,half=n/2,rounds=[];
  for(var r=0;r<n-1;r++){
    var pairs=[];
    for(var i=0;i<half;i++){
      var a=arr[i],b=arr[n-1-i];
      if(a!=null&&b!=null){ pairs.push(r%2?[b,a]:[a,b]); }
    }
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function buildFixtures(){
  var all=[],id=0;
  groups().forEach(function(g){
    var nums=S.teams.filter(function(t){return t.grp===g;}).map(function(t){return t.n;});
    roundRobin(nums).forEach(function(pairs,ri){
      shuffle(pairs).forEach(function(p){
        all.push({id:++id,grp:g,rd:ri+1,a:p[0],b:p[1],st:'pending',board:null,la:0,lb:0,win:null,kind:'group'});
      });
    });
  });
  all.sort(function(x,y){return x.rd-y.rd || (x.grp<y.grp?-1:1);});
  all.forEach(function(f,i){f.id=i+1;});
  S.fixtures=all;
}
function busyTeams(){
  var s={};S.fixtures.forEach(function(f){if(f.st==='live'){s[f.a]=1;s[f.b]=1;}});return s;
}
function liveGames(){return S.fixtures.filter(function(f){return f.st==='live';});}
function stranded(){return liveGames().filter(function(f){return f.board>S.cfg.boards;});}
function freeBoard(){
  var live=liveGames();
  if(live.length>=S.cfg.boards)return null;      // every board is occupied, whatever it's numbered
  var used={};live.forEach(function(f){if(f.board)used[f.board]=1;});
  for(var i=1;i<=S.cfg.boards;i++){if(!used[i])return i;}
  return null;
}
/* After a board frees up, pull any game sitting on a now-retired board down onto a real one. */
function reboard(){
  var s=stranded();
  for(var i=0;i<s.length;i++){
    var used={};liveGames().forEach(function(f){if(f.board)used[f.board]=1;});
    for(var b=1;b<=S.cfg.boards;b++){if(!used[b]){s[i].board=b;break;}}
  }
}
function nextUp(){
  var busy=busyTeams();
  for(var i=0;i<S.fixtures.length;i++){
    var f=S.fixtures[i];
    if(f.st==='pending'&&!busy[f.a]&&!busy[f.b])return f.id;
  }
  return null;
}

/* ---------- standings ---------- */
function record(n){
  var r={n:n,p:0,w:0,lf:0,la:0};
  S.fixtures.forEach(function(f){
    if(f.st!=='done')return;
    if(f.a===n){r.p++;r.lf+=f.la;r.la+=f.lb;if(f.win===n)r.w++;}
    else if(f.b===n){r.p++;r.lf+=f.lb;r.la+=f.la;if(f.win===n)r.w++;}
  });
  return r;
}
function standings(grp){
  var list=S.teams.filter(function(t){return grp?t.grp===grp:true;}).map(function(t){var r=record(t.n);r.grp=t.grp;return r;});
  list.sort(function(x,y){
    if(y.w!==x.w)return y.w-x.w;
    var mx=S.manualRank[x.n],my=S.manualRank[y.n];
    if(mx!=null&&my!=null&&mx!==my)return mx-my;
    if(mx!=null&&my==null)return -1;
    if(my!=null&&mx==null)return 1;
    var dx=x.lf-x.la,dy=y.lf-y.la;
    if(dy!==dx)return dy-dx;
    return x.n-y.n;
  });
  return list;
}
function groupDone(g){return S.fixtures.every(function(f){return f.grp!==g||f.kind!=='group'||f.st==='done';});}
function allGroupsDone(){return S.fixtures.every(function(f){return f.kind!=='group'||f.st==='done';});}
function finalFix(){for(var i=0;i<S.fixtures.length;i++){if(S.fixtures[i].kind==='final')return S.fixtures[i];}return null;}

/* cluster of teams tied on wins at a given index of a sorted list */
function tieCluster(list,idx){
  if(idx>=list.length)return null;
  var w=list[idx].w,c=[];
  for(var i=0;i<list.length;i++){
    if(list[i].w===w&&S.manualRank[list[i].n]==null)c.push(list[i].n);
  }
  return c.length>1?c:null;
}

/* ---------- QR encoder: byte mode, error-correction level L, versions 1-15 ---------- */
/* Everything derivable is computed rather than tabulated. The only tabulated values are
   the EC codewords per block and the block count per version, which are cross-checked
   against an independently known list of data capacities at load time. */
var QR=(function(){
  var EC_PER_BLOCK=[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,
                    28,30,30,30,30,30,30,30,30,30,30,30,30,30,30];     // L, versions 1..40
  var NUM_BLOCKS  =[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,
                    12,12,13,14,15,16,17,18,19,19,20,21,22,24,25];     // L, versions 1..40
  /* Alignment centres: 6, then evenly spaced back from size-7. Computed, not tabulated. */
  function alignPositions(v){
    if(v===1)return [];
    var n=Math.floor(v/7)+2,size=v*4+17,last=size-7;
    var step=Math.ceil((last-6)/(n-1));
    if(step%2)step++;
    var pos=[6];
    for(var i=n-1;i>=1;i--)pos.splice(1,0,last-(n-1-i)*step);
    return pos;
  }

  function rawDataModules(v){
    var r=(16*v+128)*v+64;
    if(v>=2){
      var n=Math.floor(v/7)+2;
      r-=(25*n-10)*n-55;
      if(v>=7)r-=36;
    }
    return r;
  }
  function totalCodewords(v){return Math.floor(rawDataModules(v)/8);}
  function dataCodewords(v){return totalCodewords(v)-EC_PER_BLOCK[v-1]*NUM_BLOCKS[v-1];}

  /* --- GF(256), primitive polynomial 0x11D --- */
  var EXP=new Uint8Array(512),LOG=new Uint8Array(256);
  (function(){
    var x=1;
    for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}
    for(i=255;i<512;i++)EXP[i]=EXP[i-255];
  })();
  function mul(a,b){return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]];}
  function genPoly(n){
    var g=[1];
    for(var i=0;i<n;i++){
      var ng=new Array(g.length+1).fill(0);
      for(var j=0;j<g.length;j++){
        ng[j]^=g[j];                    // multiply by x
        ng[j+1]^=mul(g[j],EXP[i]);      // plus the alpha^i term
      }
      g=ng;
    }
    return g;   // length n+1, leading coefficient 1
  }
  function ecCodewords(data,n){
    var g=genPoly(n),rem=new Array(n).fill(0);
    for(var i=0;i<data.length;i++){
      var factor=data[i]^rem[0];
      rem.shift();rem.push(0);
      for(var j=0;j<n;j++)rem[j]^=mul(g[j+1],factor);
    }
    return rem;
  }

  /* --- BCH bits for format and version information --- */
  function formatBits(mask){                 // EC level L = 01
    var d=(0x01<<3)|mask;                    // 5 bits
    var rem=d;
    for(var i=0;i<10;i++)rem=(rem<<1)^(((rem>>>9)&1)*0x537);
    return ((d<<10)|(rem&0x3FF))^0x5412;     // 15 bits
  }
  function versionBits(v){
    var rem=v;
    for(var i=0;i<12;i++)rem=(rem<<1)^(((rem>>>11)&1)*0x1F25);
    return (v<<12)|(rem&0xFFF);              // 18 bits
  }

  /* --- matrix --- */
  function newMatrix(size){
    var m=[],r,c;
    for(r=0;r<size;r++){m.push([]);for(c=0;c<size;c++)m[r].push(null);}
    return m;
  }
  function setFinder(m,r0,c0){
    for(var r=-1;r<8;r++)for(var c=-1;c<8;c++){
      var rr=r0+r,cc=c0+c;
      if(rr<0||cc<0||rr>=m.length||cc>=m.length)continue;
      var dark=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);
      m[rr][cc]=dark?1:0;
    }
  }
  function functionPattern(v){
    var size=v*4+17,m=newMatrix(size),i;
    setFinder(m,0,0);setFinder(m,0,size-7);setFinder(m,size-7,0);
    for(i=8;i<size-8;i++){m[6][i]=(i%2===0)?1:0;m[i][6]=(i%2===0)?1:0;}
    var a=alignPositions(v);
    for(var x=0;x<a.length;x++)for(var y=0;y<a.length;y++){
      var cr=a[x],cc=a[y];
      if((cr===6&&cc===6)||(cr===6&&cc===size-7)||(cr===size-7&&cc===6))continue;
      for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++)

    }

    for(i=0;i<9;i++){

    for(c=0;c<size;c++){
      run=1;
      for(r=1;r<size;r++){
        if(m[r][c]===m[r-1][c])run++;else{if(run>=5)p+=3+(run-5);run=1;}
      }

    for(c=0;c<size;c++)p+=40*match(function(i){return m[i][c];},size);

        else if(i===8)m[7][8]=bit;

        if(i<7)m[size-1-i][8]=bit;

  /* Reads the data bits back out of a finished matrix — used to prove a round trip. */
  function readBack(res){

        var c=right-k,r=upward?(size-1-vert):vert;

    }
    var cw=[];
    for(i=0;i+8<=bits.length;i+=8){var b=0;for(j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b);}
    // de-interleave back into data codewords
    var nb=NUM_BLOCKS[v-1],total=dataCodewords(v);

    var blocks=[];for(i=0;i<nb;i++)blocks.push([]);
    var idx=0;
    for(i=0;i<shortLen+1;i++)for(j=0;j<nb;j++){

})();

/* ---------- handover between devices ---------- */
/* The payload is a name dictionary plus index-referenced rows, gzipped where the browser
   supports it, then base64url'd. Names repeat constantly across weeks, so the dictionary
   plus gzip is what keeps this inside a scannable QR. */

function b64url(bytes){
  var s='';
  for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  var s=String(str).replace(/-/g,'+').replace(/_/g,'/');

  for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function utf8(str){
  if(typeof TextEncoder!=='undefined')return new TextEncoder().encode(str);
  var out=[];
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c<0x80)out.push(c);
    else if(c<0x800)out.push(0xC0|(c>>6),0x80|(c&63));
    else out.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
  }
  return new Uint8Array(out);
}
function fromUtf8(bytes){
  if(typeof TextDecoder!=='undefined')return new TextDecoder().decode(bytes);
  var s='';for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);
  return decodeURIComponent(escape(s));
}
function gzip(bytes){
  if(typeof CompressionStream==='undefined')return Promise.resolve(null);
  try{
    var cs=new CompressionStream('gzip');
    var w=cs.writable.getWriter();w.write(bytes);w.close();
    return new Response(cs.readable).arrayBuffer().then(function(b){return new Uint8Array(b);});
  }catch(e){return Promise.resolve(null);}
}
function gunzip(bytes){
  if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('no gzip'));
  var ds=new DecompressionStream('gzip');
  var w=ds.writable.getWriter();w.write(bytes);w.close();
  return new Response(ds.readable).arrayBuffer().then(function(b){return new Uint8Array(b);});
}

/* --- what goes in the payload ---
   A flat binary format: a name dictionary followed by fixed-width records. Names are the
   only text; everything else is indices and small integers, which gzip then squeezes hard. */
function Writer(){this.b=[];}
Writer.prototype.u8=function(v){this.b.push(v&255);return this;};
Writer.prototype.u16=function(v){this.b.push(v&255,(v>>8)&255);return this;};
Writer.prototype.str=function(s){var u=utf8(s),n=Math.min(u.length,255);this.u8(n);for(var i=0;i<n;i++)this.b.push(u[i]);return this;};
Writer.prototype.date=function(d){var p=String(d||'2000-01-01').split('-');return this.u8((+p[0])-2000).u8(+p[1]).u8(+p[2]);};
Writer.prototype.bytes=function(){return new Uint8Array(this.b);};

function Reader(a){this.a=a;this.i=0;}
Reader.prototype.u8=function(){return this.a[this.i++];};
Reader.prototype.u16=function(){var v=this.a[this.i]|(this.a[this.i+1]<<8);this.i+=2;return v;};
Reader.prototype.str=function(){var n=this.u8(),s=fromUtf8(this.a.subarray(this.i,this.i+n));this.i+=n;return s;};
Reader.prototype.date=function(){var y=this.u8()+2000,m=this.u8(),d=this.u8();return y+'-'+pad(m)+'-'+pad(d);};

var SCORES=[501,401,301];
var GRPS=['\u2014','A','B','-'];
function packBytes(scope){
  var dict=[],ix={};
  function id(n){var k=key(n);if(ix[k]==null){ix[k]=dict.length;dict.push(String(n));}return ix[k];}

  var weeks=S.league.weeks,crowns=S.league.crowns;
  if(scope==='month'){
    var mk=monthKey(S.cfg.date),pm=shiftMonth(mk,-1);
    weeks=weeks.filter(function(w){var m=monthKey(w.d);return m===mk||m===pm;});
  }
  if(scope==='tonight'){weeks=[];crowns=[];}
  var night=(scope!=='league'&&S.teams.length);

  var body=new Writer();
  if(night){
    body.u8(SCORES.indexOf(S.cfg.score)+1).u8(S.cfg.bestOf).u8(S.cfg.boards).u8(S.cfg.fee)
        .u8((S.cfg.twoGroups?1:0)|(S.cfg.decider===true?2:0)|(S.cfg.decider===false?4:0))
        .u8(S.cfg.splitA).date(S.cfg.date);
    body.u8(S.people.length);
    S.people.forEach(function(p){body.u8((id(p.name)<<1)|(p.out?1:0));});
    body.u8(S.teams.length);
    // group labels are one of a tiny set, so store an index rather than a character
    S.teams.forEach(function(t){body.u8(t.n).u8(id(t.a)).u8(id(t.b)).u8(GRPS.indexOf(t.grp)+1);});
    body.u16(S.fixtures.length);
    S.fixtures.forEach(function(f){
      body.u8(((f.a-1)<<4)|((f.b-1)&15));
      body.u8(({pending:0,live:1,done:2}[f.st])|(f.la<<2)|(f.lb<<4)|((f.board||0)<<6));
      body.u8((f.rd&127)|(f.kind==='final'?128:0));
    });
    body.u8(S.checkouts.length);
    S.checkouts.forEach(function(c){body.u8(id(c.n)).u8(Math.min(c.s,255));});
    var mr=Object.keys(S.manualRank);
    body.u8(mr.length);
    mr.forEach(function(k){body.u8(+k).u8(S.manualRank[k]);});
  }else{
    body.u8(0);
  }
  body.u8(Math.min(weeks.length,255));
  weeks.slice(0,255).forEach(function(w){
    body.date(w.d).u8(Math.min(w.rows.length,255));
    w.rows.slice(0,255).forEach(function(r){body.u8(id(r.n)).u8(Math.min(r.w,255));});
  });
  body.u8(Math.min(crowns.length,255));
  crowns.slice(0,255).forEach(function(c){
    var p=c.m.split('-');
    body.u8((+p[0])-2000).u8(+p[1]).u8(Math.min(c.w,255)).u8(c.shared?1:0).u8(c.names.length);
    c.names.forEach(function(n){body.u8(id(n));});
  });

  var head=new Writer();
  head.u8(2).u8(dict.length);
  dict.forEach(function(n){head.str(n);});
  var h=head.bytes(),b=body.bytes(),out=new Uint8Array(h.length+b.length);
  out.set(h,0);out.set(b,h.length);
  return out;
}
function unpackBytes(bytes){
  var r=new Reader(bytes),i,j;
  if(r.u8()!==2)throw new Error('That code came from a different version of the app.');
  var dn=r.u8(),dict=[];
  for(i=0;i<dn;i++)dict.push(r.str());
  function nm(k){return dict[k]||'';}
  var out={league:{weeks:[],crowns:[]},night:null};
  var sc=r.u8();
  if(sc){
    var bo=r.u8(),bd=r.u8(),fee=r.u8(),flags=r.u8(),splitA=r.u8(),date=r.date();
    var cfg={score:SCORES[sc-1],bestOf:bo,boards:bd,fee:fee,
             twoGroups:!!(flags&1),decider:(flags&2)?true:((flags&4)?false:null),
             splitA:splitA,date:date};
    var pn=r.u8(),people=[];
    for(i=0;i<pn;i++){var v=r.u8();people.push({id:'q'+i,name:nm(v>>1),out:!!(v&1)});}
    var tn=r.u8(),teams=[];
    for(i=0;i<tn;i++){
      var tn2=r.u8(),ta=nm(r.u8()),tb=nm(r.u8()),g=r.u8();
      teams.push({n:tn2,a:ta,b:tb,grp:GRPS[g-1]||GRPS[0]});
    }
    var grp={};teams.forEach(function(t){grp[t.n]=t.grp;});
    var fn=r.u16(),st=['pending','live','done'],fx=[];
    for(i=0;i<fn;i++){
      var b0=r.u8(),b1=r.u8(),b2=r.u8();
      var a=(b0>>4)+1,b=(b0&15)+1,s2=st[b1&3],la=(b1>>2)&3,lb=(b1>>4)&3,bb=(b1>>6)&3;
      var kind=(b2&128)?'final':'group';
      fx.push({id:i+1,grp:kind==='final'?'F':(grp[a]||GRPS[0]),rd:b2&127,a:a,b:b,st:s2,
               board:s2==='live'?(bb||1):null,la:la,lb:lb,
               win:s2==='done'?(la>lb?a:b):null,kind:kind});
    }
    var cn=r.u8(),cos=[];
    for(i=0;i<cn;i++)cos.push({n:nm(r.u8()),s:r.u8()});
    var mn=r.u8(),mr={};
    for(i=0;i<mn;i++){var mk2=r.u8();mr[mk2]=r.u8();}
    out.night={cfg:cfg,people:people,teams:teams,fixtures:fx,checkouts:cos,manualRank:mr};
  }
  var wn=r.u8();
  for(i=0;i<wn;i++){
    var d=r.date(),rn=r.u8(),rows=[];
    for(j=0;j<rn;j++)rows.push({n:nm(r.u8()),w:r.u8()});
    out.league.weeks.push({d:d,rows:rows});
  }
  var kn=r.u8();
  for(i=0;i<kn;i++){
    var y=r.u8()+2000,mo=r.u8(),w2=r.u8(),sh=r.u8(),nn=r.u8(),names=[];
    for(j=0;j<nn;j++)names.push(nm(r.u8()));
    out.league.crowns.push({m:y+'-'+pad(mo),names:names,w:w2,shared:!!sh});
  }
  return out;
}
function encodePayload(scope){
  var raw=packBytes(scope);
  return gzip(raw).then(function(gz){
    if(gz&&gz.length<raw.length)return 'G'+b64url(gz);
    return 'J'+b64url(raw);
  });
}
function decodePayload(code){
  var s=String(code||'').trim();
  var hash=s.indexOf('#d=');
  if(hash>=0)s=s.slice(hash+3);
  if(!s)return Promise.reject(new Error('empty'));
  var tag=s[0],body=s.slice(1);
  var bytes;
  try{bytes=unb64url(body);}catch(e){return Promise.reject(new Error('That code is not readable.'));}
  var p=tag==='G'?gunzip(bytes):Promise.resolve(bytes);
  return p.then(function(b){return unpackBytes(b);});
}

/* --- merging --- */
function mergeLeague(inc){
  var added=0,updated=0;
  inc.weeks.forEach(function(w){
    var found=null;
    S.league.weeks.forEach(function(x){if(x.d===w.d)found=x;});
    if(found){
      if(JSON.stringify(found.rows)!==JSON.stringify(w.rows)){found.rows=w.rows;updated++;}
    }else{S.league.weeks.push({d:w.d,rows:w.rows});added++;}
  });
  S.league.weeks.sort(function(a,b){return a.d<b.d?-1:1;});
  var cr=0;
  inc.crowns.forEach(function(c){
    var had=false;
    S.league.crowns.forEach(function(x){if(x.m===c.m){had=true;x.names=c.names;x.w=c.w;x.shared=c.shared;}});
    if(!had){S.league.crowns.push(c);cr++;}
  });
  return {added:added,updated:updated,crowns:cr};
}
function takeNight(n){
  if(!n)return;
  S.cfg=Object.assign(S.cfg,n.cfg);
  S.people=n.people;S.teams=n.teams;S.fixtures=n.fixtures;
  S.checkouts=n.checkouts;S.manualRank=n.manualRank||{};
  var t=coTop();S.checkout=t?{name:t.n,score:t.s}:{name:'',score:0};
  S.finished=false;
  S.phase=n.teams.length?'play':(n.people.length?'entry':'setup');
}

/* --- QR as SVG --- */
/* Pure black on pure white with a full four-module quiet zone: the widest contrast a
   camera can get. Anything tinted costs scan reliability for no benefit. */
function qrSVG(text){
  var res=QR.encode(text);
  if(!res)return null;
  var m=res.m,n=m.length,q=4,size=n+q*2,d='';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)
    if(m[r][c])d+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
  return '<svg class="qr" viewBox="0 0 '+size+' '+size+'" preserveAspectRatio="xMidYMid meet" '+
    'shape-rendering="crispEdges" role="img" aria-label="Handover code">'+
    '<rect width="'+size+'" height="'+size+'" fill="#FFFFFF"/>'+
    '<path d="'+d+'" fill="#000000"/></svg>';
}
function shareURL(code){
  var base=location.origin+location.pathname;
  if(location.protocol!=='http:'&&location.protocol!=='https:')return null;
  return base+'#d='+code;
}

/* --- the share sheet --- */
var SCOPES=[['all','Everything'],['month','This month + last'],['league','League only'],['tonight','Tonight only']];
function openShare(scope){
  S.share={scope:scope||'all',code:null,url:null,err:null,ver:0};
  drawShare();buildShare();
}
function buildShare(){
  var want=S.share.scope;
  return encodePayload(want).then(function(code){
    var url=shareURL(code),text=url||code;
    var res=text.length<=QR.capacityBytes(40)?QR.encode(text):null;
    S.share.code=code;S.share.url=url;
    S.share.ver=res?res.version:0;
    S.share.err=res?null:'Too much history to fit in one code — pick a smaller slice, or copy the text instead.';
    drawShare();
  }).catch(function(e){S.share.err=String(e.message||e);drawShare();});
}
function drawShare(){
  var sh=S.share,body;
  if(!sh.code&&!sh.err){
    body='<p style="opacity:.6">Building the code…</p>';
  }else{
    var text=sh.url||sh.code;
    var svg=sh.ver?qrSVG(text):null;
    var busy=sh.ver>=26;
    body=(svg?'<div class="qrwrap">'+svg+'</div>':'')+
      (sh.err?'<p style="color:#B92A20">'+esc(sh.err)+'</p>':'')+
      (sh.ver?'<p style="opacity:.6" class="grouptag">'+(sh.ver*4+17)+' modules across'+
        (busy?' — that\u2019s a dense one. Hold the other phone close, or send a smaller slice.':' — hold the other phone about a hand\u2019s width away.')+'</p>':'')+
      (sh.url?'<p style="opacity:.7">Scan it with the other phone\u2019s camera. It opens this app with the data ready to bring in.</p>'
             :'<p style="opacity:.7">This page is open from a file rather than a web address, so scanning won\u2019t open anything. Copy the text and paste it on the other device instead.</p>')+
      '<div class="modalrow"><button class="btn" data-big="1">Make it full screen</button>'+
      '<button class="btn ghost small" data-copycode="1">Copy the text code</button>'+
      '<span class="grouptag" id="copyNote"></span></div>'+
      '<div class="modalrow" style="margin-top:10px">'+
      '<button class="btn ghost small" data-testqr="1">Scan test \u2014 tiny code, no data</button></div>';
  }
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Hand over</h2>'+
    '<p>Move tonight\u2019s board and the league across to another phone. Nothing leaves the two devices — it\u2019s all inside the code itself.</p>'+
    '<div class="choices" style="margin-bottom:16px">'+SCOPES.map(function(x){
      return '<button class="choice" aria-pressed="'+(sh.scope===x[0])+'" data-scope="'+x[0]+'">'+x[1]+'</button>';
    }).join('')+'</div>'+
    body+
    '<div class="eyebrow">Coming the other way</div>'+
    '<p>Paste a code from another device to bring its data in.</p>'+
    '<div class="modalrow"><input class="pastebox" id="pasteIn" placeholder="Paste code here" autocomplete="off">'+
    '<button class="btn" data-paste="1">Import</button></div>'+
    '<div class="modalrow" style="margin-top:18px"><button class="btn ghost" data-close="1">Done</button></div>'+
    '</div></div>');
}

/* A deliberately tiny code carrying nothing but the plain page address. If the camera
   reads this but not the big one, the problem is density, not the encoder. */
function drawTest(){
  var url=shareURL('')||'https://example.com/';
  url=url.replace(/#d=$/,'');
  var res=QR.encode(url),svg=qrSVG(url);
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Scan test</h2>'+
    '<p>This carries nothing but the address of this page \u2014 version '+(res?res.version:'?')+
    ', '+(res?res.version*4+17:'?')+' modules. About as easy as a code gets.</p>'+
    '<div class="qrwrap">'+(svg||'')+'</div>'+
    '<p style="opacity:.7">If your camera opens this one, the encoder is fine and the bigger code just needs to be shown larger. '+
    'If your camera ignores this one too, the problem is on the phone \u2014 check Settings \u203a Camera \u203a Scan QR Codes is on, '+
    'or try the Code Scanner in Control Centre.</p>'+
    '<p class="grouptag">'+esc(url)+'</p>'+
    '<div class="modalrow"><button class="btn" data-share="1">Back</button></div></div></div>');
}
function drawBig(){
  var sh=S.share,text=sh.url||sh.code;

  setModal('<div class="scrim big" data-closebig="1">'+
    '<div class="bigwrap">'+(svg||'')+

/* --- the import sheet --- */
function openImport(data,fromScan){
  S.imp={data:data,fromScan:!!fromScan};
  var wk=data.league.weeks.length,ni=data.night;
  var known={},fresh2=0;
  S.league.weeks.forEach(function(w){known[w.d]=1;});
  data.league.weeks.forEach(function(w){if(!known[w.d])fresh2++;});
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Import</h2>'+
    '<p>This code holds '+wk+' week'+(wk===1?'':'s')+' of league'+
      (fresh2?' ('+fresh2+' you don\u2019t have)':' (all of which you already have)')+
      (ni?', plus a night in progress with '+ni.teams.length+' teams':'')+'.</p>'+
    '<div class="arows" style="margin-bottom:18px">'+
      '<div class="arow"><span class="tnames">Add the league weeks</span>'+
      '<span class="grouptag">nothing of yours is lost</span></div>'+
      (ni?'<div class="arow"><span class="tnames">Take the night in progress</span>'+
      '<span class="grouptag">replaces your current board</span></div>':'')+
    '</div>'+
    '<div class="modalrow"><button class="btn" data-imp="league">Merge the league</button>'+
    (ni?'<button class="btn" data-imp="all">Merge and take the night</button>':'')+
    '<button class="btn ghost" data-imp="no">Cancel</button></div>'+
    '</div></div>');
}
function doImport(mode){
  var d=S.imp&&S.imp.data;
  S.imp=null;
  if(!d||mode==='no'){modalHTML='';clearHash();return render();}
  var r=mergeLeague(d.league);
  if(mode==='all')takeNight(d.night);
  modalHTML='';clearHash();
  var bits=[];
  if(r.added)bits.push(r.added+' new week'+(r.added===1?'':'s'));
  if(r.updated)bits.push(r.updated+' updated');
  if(r.crowns)bits.push(r.crowns+' crown'+(r.crowns===1?'':'s'));
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Imported</h2><p>'+(bits.length?esc(bits.join(', '))+'.':'Nothing new — your league already had all of it.')+
    (mode==='all'?' Tonight\u2019s board has been taken across too.':'')+'</p>'+
    '<div class="modalrow"><button class="btn" data-close="1">Right you are</button></div></div></div>');
}
function clearHash(){
  try{
    if(location.hash&&history.replaceState)history.replaceState(null,'',location.pathname+location.search);
  }catch(e){}
}
function checkIncomingHash(){
  var h=String(location.hash||'');
  if(h.indexOf('#d=')!==0)return;
  decodePayload(h).then(function(data){openImport(data,true);})
    .catch(function(e){
      clearHash();
      setModal('<div class="scrim"><div class="modal"><h2>Couldn\u2019t read that</h2>'+
        '<p>'+esc(e.message||'The code was not readable.')+'</p>'+
        '<div class="modalrow"><button class="btn" data-close="1">Close</button></div></div></div>');
    });
}

/* ---------- draw ---------- */
function splitPlan(count){
  if(!S.cfg.twoGroups)return [count];
  var a=S.cfg.splitA;
  if(!a||a<2||a>count-2){a=Math.floor(count/2);if(a%2)a--;if(a<2)a=2;}
  return [a,count-a];
}
function viewDraw(){
  var act=active(),half=act.length/2;
  var players=act.slice(0,half),nons=act.slice(half);
  var drawn=S.teams.length>0;
  var body='';
  if(!drawn){
    var made=S.pair.made,usedA={},usedB={};
    made.forEach(function(m){usedA[m[0]]=1;usedB[m[1]]=1;});
    function col(list,used,side){
      return list.map(function(p){
        var sel=S.pair.sel===p.id?' style="transform:translateY(-6px);box-shadow:0 0 0 4px #C9992B"':'';
        return '<div class="chip '+(side==='a'?'player':'nonplayer')+(used[p.id]?' out':'')+'" data-pick="'+p.id+'" data-side="'+side+'"'+sel+'>'+
          '<span class="nm">'+esc(p.name)+'</span></div>';
      }).join('');
    }
    body='<h1 class="big">The hat</h1>'+
      '<p class="sub">Pull them out yourself, or tap a player then a non-player to enter the pairs you\'ve already drawn.</p>'+
      '<div class="choices" style="margin:18px 0 8px"><button class="btn" data-draw="1">Draw all teams</button>'+
      (made.length?'<button class="btn ghost" data-clearpairs="1">Clear pairs</button>':'')+'</div>'+
      '<div class="eyebrow">Players</div><div class="chipgrid">'+col(players,usedA,'a')+'</div>'+
      '<div class="eyebrow">Non-players</div><div class="chipgrid">'+col(nons,usedB,'b')+'</div>';
    if(made.length){
      body+='<div class="eyebrow">Paired so far — '+made.length+' of '+half+'</div><div class="teamlist">'+
        made.map(function(m,i){
          var a=S.people.filter(function(p){return p.id===m[0];})[0],b=S.people.filter(function(p){return p.id===m[1];})[0];
          return '<div class="teamcard"><span class="tnum">'+(i+1)+'</span><span class="tnames">'+esc(a.name)+'<em>&</em>'+esc(b.name)+'</span></div>';
        }).join('')+'</div>';
      if(made.length===half)body+='<div style="margin-top:26px"><button class="btn" data-confirmpairs="1">Use these teams →</button></div>';
    }
  }else{
    var plan=splitPlan(S.teams.length);
    var cards=S.teams.map(function(t){
      return '<div class="teamcard"><span class="tnum">'+t.n+'</span><span><span class="tnames">'+esc(t.a)+'<em>&</em>'+esc(t.b)+'</span>'+
        (plan.length>1?'<div class="grouptag">Group '+t.grp+'</div>':'')+'</span></div>';
    }).join('');
    var n=S.teams.length,fixCount=0;
    plan.forEach(function(sz){fixCount+=sz*(sz-1)/2;});
    if(plan.length>1)fixCount+=1;
    body='<h1 class="big">'+n+' teams</h1>'+
      '<p class="sub">Redraw if the hat was unkind. '+fixCount+' games at '+S.cfg.boards+' board'+(S.cfg.boards>1?'s':'')+'.</p>'+
      '<div class="eyebrow">Format</div><div class="choices">'+
        '<button class="choice" aria-pressed="'+(!S.cfg.twoGroups)+'" data-grp="0">One group<small>everyone plays everyone</small></button>'+
        '<button class="choice" aria-pressed="'+(S.cfg.twoGroups)+'" data-grp="1">Two groups + final<small>'+(plan.length>1?plan[0]+' and '+plan[1]:'split them')+'</small></button>'+
      '</div>'+
      (S.cfg.twoGroups?'<div class="choices" style="margin-top:12px"><button class="choice" data-split="-2">− 2 from A</button><button class="choice" data-split="2">+ 2 to A</button></div>':'')+
      '<div class="eyebrow">The teams</div><div class="teamlist drawing">'+cards+'</div>'+
      '<div style="margin-top:30px" class="choices"><button class="btn" data-start="1">Start the night →</button>'+
      '<button class="btn ghost" data-redraw="1">Redraw</button>'+
      '<button class="btn ghost" data-go="entry">Back to chips</button></div>';
  }
  return '<div class="topbar"><div class="brand">Wednesday <b>Darts</b></div>'+
    '<div class="meta"><span class="pill">'+S.cfg.score+' · '+(S.cfg.bestOf===3?'Best of 3':'Single leg')+'</span>'+
    '<span class="pill gold">Pot £'+(S.people.length*S.cfg.fee)+'</span></div></div>'+
    '<div class="panel"><div class="sect">'+body+'</div></div>';
}
function assignGroups(){
  var plan=splitPlan(S.teams.length);
  S.teams.forEach(function(t,i){t.grp=plan.length>1?(i<plan[0]?'A':'B'):'—';});
}
function doDraw(){
  var act=active(),half=act.length/2;
  var players=act.slice(0,half),nons=shuffle(act.slice(half));
  S.teams=players.map(function(p,i){return {n:i+1,a:p.name,b:nons[i].name,grp:'—'};});
  shuffle(S.teams);S.teams.forEach(function(t,i){t.n=i+1;});
  assignGroups();
}

    :'<p class="sub" style="opacity:.5">Nothing recorded for '+monthLabel(mk)+' yet.</p>';

  var wk=weeks.length?weeks.map(function(w){
    var rows=w.rows.slice().sort(function(a,b){return b.w-a.w;});

        return '<span class="wr">'+esc(r.n)+'<b>'+r.w+'</b></span>';}).join('')+'</div></div>';

/* ---------- play ---------- */
function viewPlay(){
  var busy=busyTeams(),nid=nextUp(),boardFree=freeBoard()!=null;
  var multi=groups().length>1;
  var stand='';
  (multi?groups():['—']).forEach(function(g){
    var list=standings(multi?g:null),pos={};
    list.forEach(function(r,i){pos[r.n]=i+1;});
    var byTeam=list.slice().sort(function(a,b){return a.n-b.n;});
    stand+='<div class="stand-head"><h2>'+(multi?'Group '+g:'Standings')+'</h2>'+
      '<span>'+(multi?list.length+' teams · top one makes the final':'in team order · position, wins')+'</span></div>'+
      '<div class="stand-grid">'+byTeam.map(function(r){
        var cls='srow'+(pos[r.n]===1&&r.w>0?' lead':'')+(busy[r.n]?' playing':'');
        return '<div class="'+cls+'"><span class="n">'+r.n+'</span>'+
          '<span class="who">'+esc(tname(r.n))+'</span>'+
          (S.cfg.bestOf===3?'<span class="legs">'+r.lf+'-'+r.la+'</span>':'')+
          '<span class="pos">'+(r.w?ordinal(pos[r.n]):'')+'</span>'+
          '<span class="w">'+r.w+'</span></div>';
      }).join('')+'</div>';
  });

  var fx='';
  var fin=finalFix();
  var byGrp={};
  S.fixtures.forEach(function(f){if(f.kind==='group'){(byGrp[f.grp]=byGrp[f.grp]||[]).push(f);}});
  Object.keys(byGrp).sort().forEach(function(g){
    var list=byGrp[g],left=list.filter(function(f){return f.st!=='done';}).length;
    fx+='<div class="fixhead"><h2>'+(multi?'Group '+g+' fixtures':'Fixtures')+'</h2><span>'+left+' of '+list.length+' still to play</span></div>'+
      '<div class="fixgrid">'+list.map(function(f){return gameHTML(f,busy,nid,boardFree);}).join('')+'</div>';
  });
  if(fin){
    fx+='<div class="fixhead"><h2>The final</h2><span>winner takes the night</span></div>'+
      '<div class="fixgrid">'+gameHTML(fin,busy,nid,boardFree)+'</div>';
  }
  fx+='<div class="legend">'+
    '<span><i style="border-color:var(--green)"></i>To play</span>'+
    '<span><i style="border-color:var(--wire)"></i>Next up</span>'+
    '<span><i style="border-color:var(--orange)"></i>On a board</span>'+
    '<span><i style="border-color:var(--red)"></i>Played</span>'+
    '<span>Tap a game to put it on · tap the winning number to end it</span></div>';

  var ct=coTop();
  var co=ct?('Checkout '+ct.s+' · '+esc(ct.n)):'Record checkout';
  var canEnd=multi?(!!fin&&fin.st==='done'):allGroupsDone();
  return '<div id="board" class="board">'+
    '<div class="topbar"><div class="brand">Wednesday <b>Darts</b></div>'+
    '<div class="meta">'+
      '<span class="pill">'+dayLabel(S.cfg.date)+'</span>'+
      '<span class="pill tap" data-format="1">'+S.cfg.score+' · '+(S.cfg.bestOf===3?'Best of 3':'Single leg')+'</span>'+
      '<span class="pill tap" data-boards="1">'+S.cfg.boards+' board'+(S.cfg.boards>1?'s':'')+'</span>'+
      '<span class="pill gold tap" data-checkout="1">'+co+'</span>'+
      '<span class="pill gold">Pot £'+(S.people.length*S.cfg.fee)+'</span>'+
      '<button class="btn ghost small" data-league="1">League</button>'+
      '<button class="btn ghost small" data-share="1">Hand over</button>'+
      '<button class="btn small" data-end="1" '+(canEnd?'':'disabled')+'>End the night</button>'+
      '<button class="btn ghost small" data-reset="1">New night</button>'+
    '</div></div>'+
    '<div class="standings">'+stand+'</div>'+
    '<div class="fixwrap">'+fx+'</div></div>';
}
/* Always two lines: the first name, then "& " and the second. */
function tnameHTML(n){
  var t=team(n);
  if(!t)return '<span class="sname"><span class="ln">\u2014</span></span>';
  return '<span class="sname"><span class="ln">'+esc(t.a)+'</span>'+
         '<span class="ln amp">&amp; '+esc(t.b)+'</span></span>';
}
function sideHTML(f,which){
  var n=which==='a'?f.a:f.b,lg=which==='a'?f.la:f.lb;
  var win=f.win===n;
  return '<button class="sidecol'+(win?' win':'')+'" data-side="'+which+'" data-game="'+f.id+'">'+
    '<span class="side">'+n+'</span>'+
    (S.cfg.bestOf===3&&(f.st==='live'||f.st==='done')?'<span class="slegs">'+lg+'</span>':'')+
    tnameHTML(n)+'</button>';
}
function gameHTML(f,busy,nid,boardFree){
  var cls='gm '+(f.kind==='final'?'final ':'');
  if(f.st==='live')cls+='live';
  else if(f.st==='done')cls+='done';
  else if(f.id===nid)cls+='next';
  else if(busy[f.a]||busy[f.b]||!boardFree)cls+='blocked';
  else cls+='pending';
  var legs='';
  return '<div class="'+cls+'" data-game="'+f.id+'">'+
    '<span class="rd">'+(f.kind==='final'?'FINAL':'R'+f.rd)+'</span>'+
    (f.st==='live'?'<span class="bd">'+f.board+'</span>':'')+
    (f.st==='pending'&&f.id===nid?'<span class="bd nx">?</span>':'')+
    '<span class="vs">'+
      sideHTML(f,'a')+'<span class="x">v</span>'+sideHTML(f,'b')+
    '</span>'+legs+
    (f.st!=='pending'?'<button class="undo" data-amend="'+f.id+'" aria-label="Edit this game">\u270e</button>':'')+
    '</div>';
}
function fix(id){for(var i=0;i<S.fixtures.length;i++){if(S.fixtures[i].id===id)return S.fixtures[i];}return null;}

function startGame(id){
  var f=fix(id);if(!f||f.st!=='pending')return;
  var busy=busyTeams();
  if(busy[f.a]||busy[f.b])return;
  var b=freeBoard();if(!b)return;
  f.st='live';f.board=b;render();
}
function scoreLeg(id,side){
  var f=fix(id);if(!f||f.st!=='live')return;
  if(side==='a')f.la++;else f.lb++;
  if(Math.max(f.la,f.lb)>=needLegs()){
    f.win=f.la>f.lb?f.a:f.b;f.st='done';f.board=null;
    reboard();
    maybeFinal();
  }
  render();
}
function afterResultChange(f){
  S.finished=false;
  if(f.kind==='group'){
    S.fixtures=S.fixtures.filter(function(x){return x.kind!=='final';});
    S.manualRank={};
    if(allGroupsDone())maybeFinal();
  }
}
function undo(id){
  var f=fix(id);if(!f)return;
  f.st='pending';f.board=null;f.la=0;f.lb=0;f.win=null;
  reboard();
  afterResultChange(f);
  if(!modalHTML)render();
}

/* Park tonight in the league and clear the board, keeping every previous week. */
function newNight(){

  var lg=S.league,c=S.cfg;

  S.cfg.date=todayISO();S.cfg.decider=null;
  tiePending=null;S.phase='setup';modalHTML='';

}
function askNewNight(){
