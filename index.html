}
function markSVG(stream){
  var g='<svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">'+
    '<g stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round">';
  if(stream==='women')g+='<circle cx="20" cy="15" r="9"/><path d="M20 24 V35 M13 30 H27"/>';
  else g+='<circle cx="17" cy="23" r="9"/><path d="M24 16 L34 6 M26 6 H34 V14"/>';
  return g+'</g></svg>';
}

/* ---------- play ---------- */
function viewPlay(){
  var busy=busyTeams(),nid=nextUp(),boardFree=freeBoard()!=null;
  var multi=groups().length>1;
  var stand='';
  (multi?groups():['—']).forEach(function(g){
    var list=standings(multi?g:null),pos={};
    list.forEach(function(r,i){pos[r.n]=i+1;});
    var byTeam=list.slice().sort(function(a,b){return a.n-b.n;});
    stand+='<div class="stand-head"><h2>'+(multi?'Group '+g:'Standings')+'</h2>'+
      '<span>'+(multi?list.length+' teams · top one makes the final':'in team order · position, wins')+'</span></div>'+
      '<div class="stand-grid">'+byTeam.map(function(r){
        var cls='srow'+(pos[r.n]===1&&r.w>0?' lead':'')+(busy[r.n]?' playing':'');
        return '<div class="'+cls+'"><span class="n">'+r.n+'</span>'+
          '<span class="who">'+esc(tname(r.n))+'</span>'+
          (S.cfg.bestOf===3?'<span class="legs">'+r.lf+'-'+r.la+'</span>':'')+
          '<span class="pos">'+(r.w?ordinal(pos[r.n]):'')+'</span>'+
          '<span class="w">'+r.w+'</span></div>';
      }).join('')+'</div>';
  });

  var fx='';
  var fin=finalFix();
  var byGrp={};
  S.fixtures.forEach(function(f){if(f.kind==='group'){(byGrp[f.grp]=byGrp[f.grp]||[]).push(f);}});
  Object.keys(byGrp).sort().forEach(function(g){
    var list=byGrp[g],left=list.filter(function(f){return f.st!=='done';}).length;
    fx+='<div class="fixhead"><h2>'+(multi?'Group '+g+' fixtures':'Fixtures')+'</h2><span>'+left+' of '+list.length+' still to play</span></div>'+
      '<div class="fixgrid">'+list.map(function(f){return gameHTML(f,busy,nid,boardFree);}).join('')+'</div>';
  });
  if(fin){
    fx+='<div class="fixhead"><h2>The final</h2><span>winner takes the night</span></div>'+
      '<div class="fixgrid">'+gameHTML(fin,busy,nid,boardFree)+'</div>';
  }
  fx+='<div class="legend">'+
    '<span><i style="border-color:var(--green)"></i>To play</span>'+
    '<span><i style="border-color:var(--wire)"></i>Next up</span>'+
    '<span><i style="border-color:var(--orange)"></i>On a board</span>'+
    '<span><i style="border-color:var(--red)"></i>Played</span>'+
    '<span>Tap a game to put it on · tap the winning number to end it</span></div>';

  var ct=coTop();
  var co=ct?('Checkout '+ct.s+' · '+esc(ct.n)):'Record checkout';
  var canEnd=multi?(!!fin&&fin.st==='done'):allGroupsDone();
  return '<div id="board" class="board">'+
    '<div class="topbar"><div class="brand">Wednesday <b>Darts</b></div>'+
    '<div class="meta">'+
      '<span class="pill">'+dayLabel(S.cfg.date)+'</span>'+
      wakePill()+
      '<span class="pill tap" data-format="1">'+S.cfg.score+' · '+(S.cfg.bestOf===3?'Best of 3':'Single leg')+'</span>'+
      '<span class="pill tap" data-boards="1">'+S.cfg.boards+' board'+(S.cfg.boards>1?'s':'')+'</span>'+
      '<span class="pill gold tap" data-checkout="1">'+co+'</span>'+
      '<span class="pill gold">Pot £'+(S.people.length*S.cfg.fee)+'</span>'+
      '<button class="btn ghost small" data-league="1">League</button>'+
      '<button class="btn ghost small" data-share="1">Hand over</button>'+
      '<button class="btn small" data-end="1" '+(canEnd?'':'disabled')+'>End the night</button>'+
      '<button class="btn ghost small" data-reset="1">New night</button>'+
    '</div></div>'+
    '<div class="standings">'+stand+'</div>'+
    '<div class="fixwrap">'+fx+'</div></div>';
}
/* Always two lines: the first name, then "& " and the second. */
function tnameHTML(n){
  var t=team(n);
  if(!t)return '<span class="sname"><span class="ln">\u2014</span></span>';
  return '<span class="sname"><span class="ln">'+esc(t.a)+'</span>'+
         '<span class="ln amp">&amp; '+esc(t.b)+'</span></span>';
}
function sideHTML(f,which){
  var n=which==='a'?f.a:f.b,lg=which==='a'?f.la:f.lb;
  var win=f.win===n;
  return '<button class="sidecol'+(win?' win':'')+'" data-side="'+which+'" data-game="'+f.id+'">'+
    '<span class="side">'+n+'</span>'+
    (S.cfg.bestOf===3&&(f.st==='live'||f.st==='done')?'<span class="slegs">'+lg+'</span>':'')+
    tnameHTML(n)+'</button>';
}
function gameHTML(f,busy,nid,boardFree){
  var cls='gm '+(f.kind==='final'?'final ':'');
  if(f.st==='live')cls+='live';
  else if(f.st==='done')cls+='done';
  else if(f.id===nid)cls+='next';
  else if(busy[f.a]||busy[f.b]||!boardFree)cls+='blocked';
  else cls+='pending';
  var legs='';
  return '<div class="'+cls+'" data-game="'+f.id+'">'+
    '<span class="rd">'+(f.kind==='final'?'FINAL':'R'+f.rd)+'</span>'+
    (f.st==='live'?'<span class="bd">'+f.board+'</span>':'')+
    (f.st==='pending'&&f.id===nid?'<span class="bd nx">?</span>':'')+
    '<span class="vs">'+
      sideHTML(f,'a')+'<span class="x">v</span>'+sideHTML(f,'b')+
    '</span>'+legs+
    (f.st!=='pending'?'<button class="undo" data-amend="'+f.id+'" aria-label="Edit this game">\u270e</button>':'')+
    '</div>';
}
function fix(id){for(var i=0;i<S.fixtures.length;i++){if(S.fixtures[i].id===id)return S.fixtures[i];}return null;}

function startGame(id){
  var f=fix(id);if(!f||f.st!=='pending')return;
  var busy=busyTeams();
  if(busy[f.a]||busy[f.b])return;
  var b=freeBoard();if(!b)return;
  f.st='live';f.board=b;render();
}
function scoreLeg(id,side){
  var f=fix(id);if(!f||f.st!=='live')return;
  if(side==='a')f.la++;else f.lb++;
  if(Math.max(f.la,f.lb)>=needLegs()){
    f.win=f.la>f.lb?f.a:f.b;f.st='done';f.board=null;
    reboard();
    maybeFinal();
  }
  render();
}
function afterResultChange(f){
  S.finished=false;
  if(f.kind==='group'){
    S.fixtures=S.fixtures.filter(function(x){return x.kind!=='final';});
    S.manualRank={};
    if(allGroupsDone())maybeFinal();
  }
}
function undo(id){
  var f=fix(id);if(!f)return;
  f.st='pending';f.board=null;f.la=0;f.lb=0;f.win=null;
  reboard();
  afterResultChange(f);
  if(!modalHTML)render();
}

/* Park tonight in the league and clear the board, keeping every previous week. */
function newNight(){
  if(S.teams.length&&S.fixtures.some(function(f){return f.st==='done';}))
    upsertWeek(S.cfg.date,nightRows());
  var lg=S.league,c=S.cfg;
  S=fresh();
  S.league=lg;
  S.cfg.score=c.score;S.cfg.bestOf=c.bestOf;S.cfg.boards=c.boards;S.cfg.fee=c.fee;S.cfg.twoGroups=c.twoGroups;
  S.cfg.date=todayISO();S.cfg.decider=null;
  tiePending=null;S.phase='setup';modalHTML='';
  render();
}
function askNewNight(){
  var saved=S.teams.length&&S.fixtures.some(function(f){return f.st==='done';});
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Start a new night</h2>'+
    '<p>'+(saved?'Tonight\u2019s wins get written into the '+monthLabel(monthKey(S.cfg.date))+' league first. ':'')+
    'Every previous week, the table and the trophy cabinet all stay exactly as they are \u2014 only the board is cleared.</p>'+
    '<div class="modalrow"><button class="btn" data-newnight2="1">Clear the board</button>'+
    '<button class="btn ghost" data-close="1">Cancel</button></div></div></div>');
}
function askWipe(){
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Delete everything?</h2>'+
    '<p>This throws away every week, the whole league table and the trophy cabinet. There\u2019s no getting it back.</p>'+
    '<div class="modalrow"><button class="btn" data-wipe2="1" style="background:#B92A20;border-color:#B92A20;color:#EFE7D2">Delete the lot</button>'+
    '<button class="btn ghost" data-close="1">Keep it</button></div></div></div>');
}

/* ---------- amending a scored game ---------- */
function openAmend(id){
  var f=fix(id);if(!f||f.st==='pending')return;
  S.gedit={id:id,la:f.la,lb:f.lb};
  drawAmend();
}
function amendStep(side,delta){
  var g=S.gedit,need=needLegs();
  var v=(side==='a'?g.la:g.lb)+delta;
  if(v<0)v=0;if(v>need)v=need;
  var other=side==='a'?g.lb:g.la;
  if(v>=need&&other>=need)other=need-1;
  if(side==='a'){g.la=v;g.lb=other;}else{g.lb=v;g.la=other;}
  drawAmend();
}
function amendPick(side){
  var need=needLegs();
  S.gedit.la=side==='a'?need:0;
  S.gedit.lb=side==='b'?need:0;
  drawAmend();
}
function amendSave(){
  var g=S.gedit,f=fix(g.id);if(!f){S.gedit=null;return closeModal();}
  var need=needLegs(),was=f.st;
  f.la=g.la;f.lb=g.lb;
  if(Math.max(f.la,f.lb)>=need){
    f.win=f.la>f.lb?f.a:f.b;f.st='done';f.board=null;reboard();
  }else{
    f.win=null;
    if(was!=='live'){
      var busy=busyTeams(),b=freeBoard();
      if(b&&!busy[f.a]&&!busy[f.b]){f.st='live';f.board=b;}
      else{f.st='pending';f.board=null;f.la=0;f.lb=0;}
    }
  }
  S.gedit=null;modalHTML='';
  afterResultChange(f);
  if(!modalHTML)render();
}
function amendReset(){
  var id=S.gedit.id;S.gedit=null;modalHTML='';
  undo(id);
  if(!modalHTML)render();
}
function askFlip(id){
  var f=fix(id);if(!f||f.st!=='done')return;
  var loser=f.win===f.a?f.b:f.a;
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Wrong winner?</h2>'+
    '<p>Team '+f.win+' is down as beating Team '+loser+'. Are you sure you want to swap it round?</p>'+
    '<div class="arows" style="margin-bottom:18px">'+
      '<div class="arow"><span class="tnum">'+f.win+'</span><span class="tnames">'+esc(tname(f.win))+'</span>'+
        '<span class="grouptag">currently the winner</span></div>'+
      '<div class="arow win"><span class="tnum">'+loser+'</span><span class="tnames">'+esc(tname(loser))+'</span>'+
        '<span class="grouptag">would take the win</span></div>'+
    '</div>'+
    '<div class="modalrow"><button class="btn" data-flip2="'+id+'">Yes, Team '+loser+' won</button>'+
    '<button class="btn ghost" data-close="1">Leave it</button></div></div></div>');
}
function flipWinner(id){
  var f=fix(id);if(!f||f.st!=='done')return;
  f.win=f.win===f.a?f.b:f.a;
  var t=f.la;f.la=f.lb;f.lb=t;
  modalHTML='';
  afterResultChange(f);
  if(!modalHTML)render();
}
function drawAmend(){
  var g=S.gedit,f=fix(g.id);if(!f)return;
  var need=needLegs(),bo3=S.cfg.bestOf===3;
  var lead=Math.max(g.la,g.lb)>=need?('Team '+(g.la>g.lb?f.a:f.b)+' takes it '+Math.max(g.la,g.lb)+'\u2013'+Math.min(g.la,g.lb))
    :(g.la||g.lb?'Still in play at '+g.la+'\u2013'+g.lb:'Nothing scored yet');
  function row(side){
    var n=side==='a'?f.a:f.b,v=side==='a'?g.la:g.lb,win=Math.max(g.la,g.lb)>=need&&v>=need;
    return '<div class="arow'+(win?' win':'')+'">'+
      '<span class="tnum">'+n+'</span><span class="tnames">'+esc(tname(n))+'</span>'+
      (bo3?'<span class="stepper"><button data-astep="'+side+'" data-adelta="-1" aria-label="One leg fewer">\u2212</button>'+
        '<b>'+v+'</b><button data-astep="'+side+'" data-adelta="1" aria-label="One leg more">+</button></span>'
        :'<button class="btn small'+(win?'':' ghost')+'" data-apick="'+side+'">'+(win?'Winner':'They won')+'</button>')+
      '</div>';
  }
  var note=f.kind==='group'&&finalFix()?'<p style="color:#B92A20"><b>Heads up:</b> changing a group result clears the final, so it\u2019ll need throwing again.</p>':'';
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>'+(f.st==='live'?'Game in play':'Amend game')+'</h2>'+
    '<p>'+(f.kind==='final'?'The final':'Round '+f.rd)+' \u00b7 '+(f.st==='live'?'on board '+f.board:'already played')+
    ' \u00b7 '+lead+'</p>'+note+
    '<div class="arows">'+row('a')+row('b')+'</div>'+
    '<div class="modalrow" style="margin-top:20px"><button class="btn" data-asave="1">Save the score</button>'+
    '<button class="btn ghost" data-areset="1">'+(f.st==='live'?'Cancel this game':'Back to unplayed')+'</button>'+
    '<button class="btn ghost" data-aclose="1">Cancel</button></div>'+
    '</div></div>');
}
function maybeFinal(){
  if(groups().length<2||finalFix()||!allGroupsDone())return;
  var winners=[],pending=null;
  groups().forEach(function(g){
    var list=standings(g);
    var c=tieCluster(list,0);
    if(c&&!pending)pending=c;
    winners.push(list[0].n);
  });
  if(pending){openTie(pending,'Group decider');return;}
  var maxId=0;S.fixtures.forEach(function(f){if(f.id>maxId)maxId=f.id;});
  S.fixtures.push({id:maxId+1,grp:'F',rd:99,a:winners[0],b:winners[1],st:'pending',board:null,la:0,lb:0,win:null,kind:'final'});
}

/* ---------- tie-breaks & results ---------- */
var tiePending=null;
function openTie(nums,label){
  tiePending={nums:nums,order:[],label:label||'Tie-break'};
  drawTie();
}
function drawTie(){
  var t=tiePending;
  var many=t.nums.length>4;
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>'+esc(t.label)+'</h2>'+
    '<p>'+t.nums.length+' teams are level. '+
    (many?'That\'s more than the usual four — settle it however you like (nearest the bull, sudden death, coin), then tap them in finishing order.'
        :'Play a single game between them, then tap them in finishing order — winner first.')+'</p>'+
    '<div class="picklist">'+t.nums.map(function(n){
      var i=t.order.indexOf(n);
      return '<button class="pick'+(i>=0?' taken':'')+'" data-tie="'+n+'"'+(i>=0?' disabled':'')+'>'+
        '<span class="tnum">'+n+'</span><span><span class="tnames">'+esc(tname(n))+'</span>'+
        (i>=0?'<div class="grouptag">Placed '+(i+1)+'</div>':'')+'</span></button>';
    }).join('')+'</div>'+
    '<div class="modalrow"><button class="btn ghost" data-tiecancel="1">Cancel</button></div>'+
    '</div></div>');
}
function pickTie(n){
  var t=tiePending;if(!t||t.order.indexOf(n)>=0)return;
  t.order.push(n);
  if(t.order.length>=t.nums.length-1){
    t.nums.forEach(function(x){if(t.order.indexOf(x)<0)t.order.push(x);});
    t.order.forEach(function(x,i){S.manualRank[x]=i;});
    tiePending=null;modalHTML='';
    maybeFinal();
    if(S.pendingEnd){S.pendingEnd=false;endNight();}else render();
    return;
  }
  drawTie();
}
function endNight(){
  var multi=groups().length>1,fin=finalFix();
  var first,second;
  if(multi&&fin&&fin.st==='done'){
    first=fin.win;second=(fin.win===fin.a?fin.b:fin.a);
  }else{
    var list=standings(null);
    var c1=tieCluster(list,0);
    if(c1){S.pendingEnd=true;openTie(c1,'Tie for first');return;}
    var c2=tieCluster(list,1);
    if(c2){S.pendingEnd=true;openTie(c2,'Tie for second');return;}
    first=list[0].n;second=list[1]?list[1].n:null;
  }
  S.finished=true;
  var rows=nightRows();
  upsertWeek(S.cfg.date,rows);
  var mk=monthKey(S.cfg.date),tbl=leagueTable(mk);
  var r1=record(first),r2=second?record(second):null;
  var pot=S.people.length*S.cfg.fee;
  var lead='<table class="ltable"><tbody>'+tbl.slice(0,5).map(function(r,i){
    return '<tr'+(i===0?' class="lead"':'')+'><td class="c-pos">'+(i+1)+'</td>'+
      '<td class="c-name">'+esc(r.n)+'</td><td class="c-num c-win">'+r.w+'</td></tr>';
  }).join('')+'</tbody></table>';
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>That\'s the night</h2>'+
    '<p>'+S.cfg.score+', '+(S.cfg.bestOf===3?'best of three':'single leg')+' · '+S.teams.length+' teams · £'+pot+' in the pot. '+
    'Everyone\'s wins have gone into the '+monthLabel(mk)+' league.</p>'+
    '<div class="podium">'+
      '<div class="plc gold"><span class="rank">1</span><span><span class="who">'+esc(tname(first))+'</span></span><span class="rec">Team '+first+' · '+r1.w+' wins</span></div>'+
      (second?'<div class="plc silver"><span class="rank">2</span><span><span class="who">'+esc(tname(second))+'</span></span><span class="rec">Team '+second+' · '+r2.w+' wins</span></div>':'')+
      (coTop()?'<div class="plc"><span class="rank">✱</span><span><span class="who">'+esc(coTop().n)+'</span><div class="grouptag">Highest checkout · '+coTop().s+
        (S.checkouts.length>1?' · next best '+S.checkouts.slice().sort(function(a,b){return b.s-a.s;})[1].s:'')+'</div></span></div>':'')+
    '</div>'+
    '<div class="eyebrow">'+monthLabel(mk)+' so far</div>'+lead+
    '<div class="modalrow"><button class="btn" data-close="1">Back to the board</button>'+
    '<button class="btn ghost" data-league="1">Open the league</button>'+
    '<button class="btn ghost" data-reset="1">New night</button></div>'+
    '</div></div>');
}
function coBest(name){
  var k=key(name),b=0;
  S.checkouts.forEach(function(c){if(key(c.n)===k&&c.s>b)b=c.s;});
  return b;
}
function coTop(){
  var best=null;
  S.checkouts.forEach(function(c){if(!best||c.s>best.s)best=c;});
  return best;
}
function openCheckout(name){
  S.co={name:name||'',score:0};
  drawCheckout();
}
function coStep(delta){
  var v=S.co.score+delta;
  if(v<0)v=0;if(v>170)v=170;
  S.co.score=v;drawCheckout();
}
function drawCheckout(){
  var c=S.co,top=coTop();
  var chips=S.people.map(function(p){
    var on=key(p.name)===key(c.name),b=coBest(p.name);
    return '<div class="chip co'+(on?' on':'')+'" data-coname="'+esc(p.name)+'">'+
      chipName(p.name)+
      (b?'<span class="rk co-score">'+b+'</span>':'')+'</div>';
  }).join('');
  var valid=c.name&&c.score>=2;
  var beats=valid&&(!top||c.score>top.s);
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Checkout</h2>'+
    '<p>'+(top?'Best so far is '+esc(top.n)+' on '+top.s+'. ':'Nothing recorded yet. ')+
    'Tap whoever hit it, then dial in the score.</p>'+
    '<div class="chipgrid rack" style="margin-bottom:18px">'+
      (chips||'<span class="sub" style="opacity:.5">Nobody\u2019s on the board yet.</span>')+'</div>'+
    '<div class="arows"><div class="arow'+(beats?' win':'')+'">'+
      '<span class="tnames">'+(c.name?esc(c.name):'Pick a name')+'</span>'+
      '<span class="stepper">'+
        '<button data-costep="-10" aria-label="Ten less">\u2212\u2212</button>'+
        '<button data-costep="-1" aria-label="One less">\u2212</button>'+
        '<b>'+c.score+'</b>'+
        '<button data-costep="1" aria-label="One more">+</button>'+
        '<button data-costep="10" aria-label="Ten more">++</button>'+
      '</span></div></div>'+
    (valid&&!beats?'<p style="margin-top:12px;opacity:.7">That won\u2019t beat '+esc(top.n)+'\u2019s '+top.s+', but it\u2019ll still be saved against their name.</p>':'')+
    '<div class="modalrow" style="margin-top:18px"><button class="btn" data-cosave="1" '+(valid?'':'disabled')+'>Save</button>'+
    (c.name&&coBest(c.name)?'<button class="btn ghost" data-coclear="'+esc(c.name)+'">Clear '+esc(c.name)+'\u2019s</button>':'')+
    '<button class="btn ghost" data-close="1">Cancel</button></div></div></div>');
}
function coSave(){
  var c=S.co;
  if(!c.name||c.score<2)return;
  var k=key(c.name),done=false;
  S.checkouts.forEach(function(x){if(key(x.n)===k){if(c.score>x.s)x.s=c.score;done=true;}});
  if(!done)S.checkouts.push({n:c.name,s:c.score});
  var t=coTop();
  S.checkout=t?{name:t.n,score:t.s}:{name:'',score:0};
  S.co=null;return closeModal();
}
function openFormat(){
  var started=S.fixtures.some(function(f){return f.st!=='pending';});
  var lg=liveGames().length;
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Format</h2><p>Change it whenever you like \u2014 results already on the board are kept exactly as they are.</p>'+
    '<div class="eyebrow">Game</div><div class="choices">'+[501,401,301].map(function(n){
      return '<button class="choice" aria-pressed="'+(S.cfg.score===n)+'" data-setscore="'+n+'">'+n+'</button>';}).join('')+'</div>'+
    '<div class="eyebrow">Match length</div><div class="choices">'+
      '<button class="choice" aria-pressed="'+(S.cfg.bestOf===1)+'" data-setbo="1">Single leg</button>'+
      '<button class="choice" aria-pressed="'+(S.cfg.bestOf===3)+'" data-setbo="3">Best of 3<small>first to 2</small></button>'+
    '</div>'+
    (started?'<p style="margin-top:16px;opacity:.7">Games already played keep their result. '+
      (lg?'The '+lg+' game'+(lg>1?'s':'')+' in play will be re-checked against the new length.':'')+'</p>':'')+
    '<div class="modalrow" style="margin-top:18px"><button class="btn" data-close="1">Done</button></div></div></div>');
}
/* Switching length mid-night: settle or reopen anything in play under the new rule. */
function applyBestOf(n){
  S.cfg.bestOf=n;
  var need=needLegs();
  liveGames().forEach(function(f){
    if(f.la>=need&&f.lb>=need){f.la=0;f.lb=0;return;}   // both past the post: start the match again
    if(Math.max(f.la,f.lb)>=need){
      f.win=f.la>f.lb?f.a:f.b;f.st='done';f.board=null;
    }
  });
  reboard();
  S.finished=false;
  S.fixtures=S.fixtures.filter(function(x){return x.kind!=='final';});
  S.manualRank={};
  if(allGroupsDone())maybeFinal();
}

function openBoards(){
  var live=liveGames(),str=stranded();
  var warn='';
  if(str.length){
    warn='<p style="color:#B92A20"><b>'+str.length+' game'+(str.length>1?'s are':' is')+' still on board '+
      str.map(function(f){return f.board;}).join(' and ')+', which you\u2019ve just retired.</b> '+
      'Finish '+(str.length>1?'them':'it')+' as normal, or send '+(str.length>1?'them':'it')+' back to the pool to be replayed later.</p>'+
      '<div class="arows" style="margin-bottom:16px">'+str.map(function(f){
        return '<div class="arow"><span class="tnum">'+f.board+'</span>'+
          '<span class="tnames">'+f.a+' v '+f.b+'</span>'+
          '<button class="btn small" data-pull="'+f.id+'">Send back</button></div>';
      }).join('')+'</div>';
  }
  setModal('<div class="scrim"><div class="modal">'+
    '<h2>Boards in use</h2><p>Drop to one if a board goes down, or add a third if it frees up. '+
    live.length+' game'+(live.length===1?' is':'s are')+' being played right now.</p>'+
    '<div class="choices" style="margin-bottom:18px">'+[1,2,3].map(function(n){
      return '<button class="choice" aria-pressed="'+(S.cfg.boards===n)+'" data-setboards="'+n+'">'+n+'</button>';}).join('')+'</div>'+
    warn+
    '<div class="modalrow"><button class="btn" data-close="1">Done</button></div></div></div>');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(wakeWanted&&!wakeLock)requestWake();
  var t=e.target.closest('[data-cfg],[data-go],[data-add],[data-del],[data-up],[data-down],[data-person],[data-draw],[data-pick],[data-clearpairs],[data-confirmpairs],[data-grp],[data-split],[data-start],[data-redraw],[data-game],[data-side],[data-undo],[data-amend],[data-astep],[data-apick],[data-asave],[data-areset],[data-aclose],[data-estep],[data-newnight2],[data-wipe],[data-wipe2],[data-waketoggle],[data-wakeinfo],[data-restore],[data-restore2],[data-flip2],[data-end],[data-reset],[data-checkout],[data-boards],[data-setboards],[data-pull],[data-cosave],[data-coname],[data-costep],[data-coclear],[data-format],[data-share],[data-scope],[data-copycode],[data-send],[data-showtext],[data-paste],[data-imp],[data-setscore],[data-setbo],[data-close],[data-tie],[data-tiecancel],[data-dec],[data-league],[data-back],[data-month],[data-addweek],[data-trophy],[data-troomclose],[data-year],[data-tstream],[data-editweek],[data-eadd],[data-erm],[data-esave],[data-edel],[data-edel2],[data-eback],[data-eclose],[data-reg],[data-lastorder],[data-crown],[data-crownsel],[data-crownsave],[data-crowncancel],[data-wsel],[data-wsave],[data-wskip],[data-mcell],[data-msave],[data-mclear],[data-mclose],[data-uncrown]');
  if(!t)return;
  var d=t.dataset;

  if(d.dec){S.cfg.decider=d.dec==='1';return render();}
  if(d.league){if(S.phase!=='league'){S.prevPhase=S.phase;lgMonth=monthKey(S.cfg.date);S.phase='league';}modalHTML='';return render();}
  if(d.back){S.phase=S.prevPhase||'setup';return render();}
  if(d.month){lgMonth=shiftMonth(lgMonth||monthKey(S.cfg.date),parseInt(d.month,10));return render();}
  if(d.trophy){
    S.phase='trophy';tStream='open';       /* the room always opens on the open trophy */
    justWomen=null;
    lgYear=(lgMonth||monthKey(S.cfg.date)).slice(0,4);
    justCrowned=null;modalHTML='';return render();
  }
  if(d.troomclose){justCrowned=null;justWomen=null;S.phase='league';return render();}
  if(d.tstream){tStream=d.tstream;if(d.tstream==='women')justWomen=null;return render();}
  if(d.year){
    var ys=crownYears(),i2=ys.indexOf(lgYear)+parseInt(d.year,10);
    if(i2>=0&&i2<ys.length)lgYear=ys[i2];
    return render();
  }
  if(d.addweek){return openWeekEditor(null);}
  if(d.editweek){return openWeekEditor(d.editweek);}
  if(d.eadd){harvest();S.edit.rows.push({n:'',w:0});return drawEditor();}
  if(d.estep){
    harvest();
    var ei=parseInt(d.estep,10),ev=(S.edit.rows[ei].w||0)+parseInt(d.edelta,10);
    S.edit.rows[ei].w=ev<0?0:(ev>99?99:ev);
    return drawEditor();
  }
  if(d.erm){harvest();S.edit.rows.splice(parseInt(d.erm,10),1);if(!S.edit.rows.length)S.edit.rows.push({n:'',w:0});return drawEditor();}
  if(d.esave){
    harvest();
    var rows=S.edit.rows.filter(function(r){return r.n;});
    if(!rows.length){S.league.weeks=S.league.weeks.filter(function(w){return w.d!==S.edit.d;});}
    else upsertWeek(S.edit.d,rows);
    lgMonth=monthKey(S.edit.d);S.edit=null;return closeModal();
  }
  if(d.edel){return askDeleteWeek(d.edel);}
  if(d.edel2){
    S.league.weeks=S.league.weeks.filter(function(w){return w.d!==d.edel2;});
    S.edit=null;lgMonth=monthKey(d.edel2);
    return closeModal();
  }
  if(d.eback){return drawEditor();}
  if(d.eclose){S.edit=null;return closeModal();}
  if(d.crown){return openCrown(d.crown);}
  if(d.crownsel){
    var cs=crownPick,i3=cs.sel.indexOf(d.crownsel);
    if(i3>=0)cs.sel.splice(i3,1);
    else{cs.sel.push(d.crownsel);if(cs.sel.length>2)cs.sel.shift();}
    return drawCrown();
  }
  if(d.crownsave){
    var cm2=crownPick.m;
    setCrown(cm2,crownPick.sel,crownPick.w);
    crownPick=null;modalHTML='';
    return openWomen(cm2);
  }
  if(d.crowncancel){crownPick=null;return closeModal();}
  if(d.wsel){
    var ws=womenPick,i4=ws.sel.indexOf(d.wsel);
    if(i4>=0)ws.sel.splice(i4,1);
    else{ws.sel.push(d.wsel);if(ws.sel.length>2)ws.sel.shift();}
    return drawWomen();
  }
  if(d.wsave){
    var wm=womenPick.m,wsel=womenPick.sel.slice();
    setCrown(wm,wsel,null,'women');
    womenPick=null;modalHTML='';
    justWomen=wsel.length?wsel:null;
    return showTrophy(wm,'open');
  }
  if(d.wskip){
    var wm2=womenPick.m;womenPick=null;modalHTML='';
    justWomen=null;
    return showTrophy(wm2,'open');
  }
  if(d.mcell){return openMonthEdit(d.mcell,d.mstream||'open');}
  if(d.msave){
    harvestMonth();
    var mm=S.medit.m,mst=S.medit.stream;
    setCrown(mm,[S.medit.a,S.medit.b],null,mst);
    S.medit=null;modalHTML='';
    return showTrophy(mm,mst);
  }
  if(d.mclear){
    setCrown(d.mclear,[],null,S.medit?S.medit.stream:'open');
    S.medit=null;return closeModal();
  }
  if(d.mclose){S.medit=null;return closeModal();}
  if(d.uncrown){S.league.crowns=S.league.crowns.filter(function(c){return c.m!==d.uncrown;});return render();}

  if(d.cfg){S.cfg[d.cfg]=parseInt(d.val,10);return render();}
  if(d.go){
    if(d.go==='draw'&&!S.teams.length)S.pair={sel:null,made:[]};
    S.phase=d.go;return render();
  }
  if(d.add!=null&&!d.person){return addName();}
  if(d.reg){if(here(d.reg))dropPerson(d.reg);else addPerson(d.reg);return render();}
  if(d.lastorder){applyLastOrder();return render();}
  if(d.del){S.people=S.people.filter(function(p){return p.id!=d.del;});return render();}
  if(d.up||d.down){movePerson(d.up||d.down,d.up?'up':'down');return render();}
  if(d.person){var p=S.people.filter(function(x){return x.id==d.person;})[0];if(p){p.out=!p.out;}return render();}

  if(d.draw){doDraw();return render();}
  if(d.redraw){doDraw();return render();}
  if(d.clearpairs){S.pair={sel:null,made:[]};return render();}
  if(d.pick){
    var pid=d.pick;
    if(d.side==='a'){S.pair.sel=(S.pair.sel==pid?null:pid);}
    else if(S.pair.sel){
      var used=S.pair.made.some(function(m){return m[1]==pid;});
      if(!used){S.pair.made.push([S.pair.sel,pid]);S.pair.sel=null;}
    }
    return render();
  }
  if(d.confirmpairs){
    S.teams=S.pair.made.map(function(m,i){
      var a=S.people.filter(function(x){return x.id==m[0];})[0],b=S.people.filter(function(x){return x.id==m[1];})[0];
      return {n:i+1,a:a.name,b:b.name,grp:'—'};
    });
    assignGroups();return render();
  }
  if(d.grp!=null&&!d.person){S.cfg.twoGroups=d.grp==='1';S.cfg.splitA=0;assignGroups();return render();}
  if(d.split){
    var plan=splitPlan(S.teams.length);
    var a=plan[0]+parseInt(d.split,10);
    if(a>=2&&a<=S.teams.length-2){S.cfg.splitA=a;assignGroups();}
    return render();
  }
  if(d.start){buildFixtures();S.manualRank={};S.finished=false;S.phase='play';requestWake();return render();}

  if(d.amend){e.stopPropagation();return openAmend(parseInt(d.amend,10));}
  if(d.astep){return amendStep(d.astep,parseInt(d.adelta,10));}
  if(d.apick){return amendPick(d.apick);}
  if(d.asave){return amendSave();}
  if(d.areset){return amendReset();}
  if(d.aclose){S.gedit=null;return closeModal();}
  if(d.game){
    var gid=parseInt(d.game,10),gf=fix(gid);
    if(d.side&&gf&&gf.st==='live'){e.stopPropagation();return scoreLeg(gid,d.side);}
    if(gf&&gf.st==='live')return openAmend(gid);
    if(gf&&gf.st==='done')return;
    return startGame(gid);
  }

  if(d.end){return endNight();}
  if(d.checkout){return openCheckout();}
  if(d.boards){return openBoards();}
  if(d.setboards){S.cfg.boards=parseInt(d.setboards,10);reboard();return openBoards();}
  if(d.pull){undo(parseInt(d.pull,10));return openBoards();}
  if(d.coname){S.co.name=(key(S.co.name)===key(d.coname))?'':d.coname;if(S.co.name&&!S.co.score)S.co.score=coBest(S.co.name)||2;return drawCheckout();}
  if(d.costep){return coStep(parseInt(d.costep,10));}
  if(d.cosave){return coSave();}
  if(d.coclear){
    var ck=key(d.coclear);
    S.checkouts=S.checkouts.filter(function(x){return key(x.n)!==ck;});
    var t2=coTop();S.checkout=t2?{name:t2.n,score:t2.s}:{name:'',score:0};
    S.co.score=0;return drawCheckout();
  }
  if(d.share){return openShare();}
  if(d.scope){S.share.scope=d.scope;S.share.code=null;S.share.err=null;drawShare();return buildShare();}
  if(d.send){return sendLink();}
  if(d.showtext){S.share.showText=!S.share.showText;return drawShare();}
  if(d.copycode){
    var cc=S.share&&S.share.code?(S.share.url||S.share.code):'';
    if(!cc)return;
    function noteCopied(okc){var el2=document.getElementById('copyNote');if(el2)el2.textContent=okc?'copied':'press and hold the text to copy';}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(cc).then(function(){noteCopied(true);},function(){S.share.showText=true;drawShare();noteCopied(false);});
    }else{S.share.showText=true;drawShare();noteCopied(false);}
    return;
  }
  if(d.paste){
    var pv=document.getElementById('pasteIn');

      .catch(function(err){
        setModal('<div class="scrim"><div class="modal"><h2>Couldn\u2019t read that</h2><p>'+

          '<div class="modalrow"><button class="btn" data-share="1">Back</button></div></div></div>');
      });
    return;
  }
  if(d.imp){return doImport(d.imp);}
  if(d.format){return openFormat();}
  if(d.setscore){S.cfg.score=parseInt(d.setscore,10);return openFormat();}
  if(d.setbo){applyBestOf(parseInt(d.setbo,10));return openFormat();}
  if(d.tie){return pickTie(parseInt(d.tie,10));}
  if(d.tiecancel){tiePending=null;S.pendingEnd=false;return closeModal();}
  if(d.close){return closeModal();}
  if(d.reset){return askNewNight();}
  if(d.newnight2){return newNight();}
  if(d.restore){
    var bi=backupInfo();
    if(!bi)return;
    return setModal('<div class="scrim"><div class="modal"><h2>Restore the backup?</h2>'+
      '<p>This puts back the save from '+esc(bi.v)+', exactly as it was before this version first opened on '+esc(bi.at)+'. '+
      'Anything you have done since will be replaced.</p>'+
      '<div class="modalrow"><button class="btn" data-restore2="1">Put it back</button>'+
      '<button class="btn ghost" data-close="1">Cancel</button></div></div></div>');
  }
  if(d.restore2){

    if(!bi2)return closeModal();
    try{
      var old4=JSON.parse(bi2.data);
      S=Object.assign(fresh(),old4);
      S.cfg=Object.assign(fresh().cfg,S.cfg||{});
      S.league=Object.assign({weeks:[],crowns:[]},S.league||{});
      if(!Array.isArray(S.checkouts))S.checkouts=[];
      if(!S.checkouts.length&&S.checkout&&S.checkout.score>0&&S.checkout.name)
        S.checkouts=[{n:String(S.checkout.name).toUpperCase(),s:S.checkout.score}];
      tiePending=null;modalHTML='';
    }catch(e5){}
    return render();
  }
  if(d.waketoggle){
    if(wakeWanted)releaseWake();
    else{wakeWanted=true;wakeState='idle';requestWake();}
    return render();
  }
  if(d.wakeinfo){return wakeInfo();}
  if(d.wipe){return askWipe();}
  if(d.wipe2){
    try{store.removeItem(KEY);}catch(err){}
    S=fresh();tiePending=null;modalHTML='';return render();
  }
  if(d.flip2){modalHTML='';return flipWinner(parseInt(d.flip2,10));}
});
